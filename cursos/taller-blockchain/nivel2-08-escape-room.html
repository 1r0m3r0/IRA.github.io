 <style>

   margin: 0;
   padding: 0;
   box-sizing: border-box;

   box-shadow: 0 25px 45px rgba(0, 0, 0, 0.6);

  .hero {
   background: linear-gradient(95deg, #2a1f4a, #1a0f3a);
   padding: 1.5rem 2rem;
   text-align: center;
   border-bottom: 3px solid #ff66c0;

  .hero h1 {
   font-size: 2rem;
   font-weight: 800;
   background: linear-gradient(135deg, #ffccff, #ff66c0);
   -webkit-background-clip: text;

  .hero p {
   margin-top: 0.5rem;

  .timer-bar {
   background: #00000066;
   padding: 0.5rem;

  .escape-room {

   background: #1a1530d9;

  .puzzle-status {

   border-radius: 2rem;

  .puzzle-question {

  .puzzle-input {
   display: flex;

  .puzzle-input input {

  }

  .check-btn {
   background: #ff66c0;
   border: none;
   padding: 0.5rem 1.2rem;
   border-radius: 2rem;
   font-weight: bold;
   cursor: pointer;
  }

  .hint-btn {
   background: #555;
   border: none;
   padding: 0.3rem 0.8rem;
   border-radius: 2rem;

  }

  .feedback {
   background: #00000099;

   margin-top: 0.8rem;

  }

  .final-message {
   text-align: center;
   background: linear-gradient(95deg, #2ecc71, #27ae60);
   border-radius: 2rem;

  }

  .nav-links {
   display: flex;

  .nav-link {

   transform: translateY(-2px);
   box-shadow: 0 0 10px rgba(0, 224, 255, 0.4);
  }
  .nav-link.next { background: linear-gradient(95deg, #f0a500, #ff6a00); color: #1e1a0c; }
  .nav-link.menu { background: #1a2a4a; border: 1px solid #3399ff; }

 </style>
 <link rel="stylesheet" href="../../assets/css/theme.css">

<body>
 <nav class="brand-return-nav"><a href="../../index.html">&larr; Portfolio</a><a href="../../cursos/index.html">Cursos</a></nav>

<div class="escape-container">
 <div class="hero">
  <h1><i class="fas fa-door-open"></i> Escape Room Cripto</h1>
  <p>Resuelve los 5 acertijos para escapar de la bóveda digital</p>
 </div>
 <div class="timer-bar" id="timerDisplay">⏱️ Tiempo restante: 10:00</div>

 <div class="escape-room" id="escapeRoom">
  <!-- Los puzzles se generarán con JS -->
 </div>

 <div class="nav-links">
  <a href="../../cursos/taller-blockchain/nivel2-07-carreras-blockchain.html" class="nav-link prev"><i class="fas fa-arrow-left"></i> Anterior</a>
  <a href="index.html" class="nav-link menu"><i class="fas fa-home"></i> Menú</a>
  <button id="restartBtn" class="restart-btn"><i class="fas fa-redo-alt"></i> Reiniciar escape room</button>
 </div>
</div>

<script>
 // Definición de los 5 acertijos
 const puzzles = [
  {
   title: "🔐 Acertijo 1: El bloque génesis",
   question: "¿En qué año se minó el primer bloque de Bitcoin (bloque génesis)? (responde con el número de 4 dígitos)",
   answer: "2009",
   hint: "Fue el 3 de enero de 2009. Satoshi Nakamoto minó el bloque 0."
  },
  {
   title: "🔗 Acertijo 2: La cadena inmutable",
   question: "¿Qué propiedad hace que si cambias un dato en un bloque, todos los bloques siguientes se invaliden? (una palabra, comienza con H)",
   answer: "hash",
   hint: "Es una función criptográfica que genera una huella única. Sin ella, no habría 'cadena'."
  },
  {
   title: "⛏️ Acertijo 3: La fiebre del minero",
   question: "¿Cómo se llama el proceso de resolver puzzles matemáticos para agregar bloques a la blockchain?",
   answer: "minería",
   hint: "También se le conoce como 'proof of work'. Los mineros compiten por la recompensa."
  },
  {
   title: "🤖 Acertijo 4: El robot que cumple promesas",
   question: "¿Qué tipo de programa en Ethereum se ejecuta automáticamente cuando se cumplen condiciones? (dos palabras)",
   answer: "contrato inteligente",
   hint: "Se escribe en Solidity. Son autoejecutables y no requieren intermediarios."
  },
  {
   title: "🛡️ Acertijo 5: La regla de oro de seguridad",
   question: "¿Qué frase secreta de 12 o 24 palabras permite recuperar una wallet? (dos palabras)",
   answer: "frase semilla",
   hint: "También se llama 'seed phrase'. Nunca la compartas con nadie."
  }
 ];

 let solved = [false, false, false, false, false];
 let timerSeconds = 600; // 10 minutos
 let timerInterval = null;
 let gameCompleted = false;

 // Elementos
 const escapeRoomDiv = document.getElementById('escapeRoom');
 const timerDisplaySpan = document.getElementById('timerDisplay');
 const restartBtn = document.getElementById('restartBtn');

 function renderPuzzles() {
  escapeRoomDiv.innerHTML = '';
  puzzles.forEach((puzzle, idx) => {
   const card = document.createElement('div');
   card.className = 'puzzle-card';
   card.id = `puzzle-${idx}`;
   const statusClass = solved[idx] ? 'solved' : '';
   card.innerHTML = `
    <div class="puzzle-header">
     <span class="puzzle-title">${puzzle.title}</span>
     <span class="puzzle-status ${statusClass}">${solved[idx] ? '✅ Resuelto' : '🔒 Bloqueado'}</span>
    </div>
    <div class="puzzle-question">${puzzle.question}</div>
    <div class="puzzle-input">
     <input type="text" id="input-${idx}" placeholder="Tu respuesta..." ${solved[idx] ? 'disabled' : ''}>
     <button class="check-btn" data-idx="${idx}" ${solved[idx] ? 'disabled' : ''}>Verificar</button>
     <button class="hint-btn" data-idx="${idx}">💡 Pista</button>
    </div>
    <div id="feedback-${idx}" class="feedback" style="display: none;"></div>
   `;
   escapeRoomDiv.appendChild(card);
  });
  // Añadir eventos
  document.querySelectorAll('.check-btn').forEach(btn => {
   btn.addEventListener('click', (e) => {
    const idx = parseInt(btn.dataset.idx);
    checkAnswer(idx);
   });
  });
  document.querySelectorAll('.hint-btn').forEach(btn => {
   btn.addEventListener('click', (e) => {
    const idx = parseInt(btn.dataset.idx);
    showHint(idx);
   });
  });
 }

 function normalize(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
 }

 function checkAnswer(idx) {
  if (solved[idx]) return;
  const input = document.getElementById(`input-${idx}`);
  const answer = normalize(input.value.trim());
  const correct = normalize(puzzles[idx].answer);
  const feedbackDiv = document.getElementById(`feedback-${idx}`);
  if (answer === correct || answer === correct.replace(/ /g, '')) {
   solved[idx] = true;
   feedbackDiv.style.display = 'block';
   feedbackDiv.innerHTML = I18N.t('fb_0');
   feedbackDiv.style.color = '#aaffaa';
   // Deshabilitar input y botón
   input.disabled = true;
   const btn = document.querySelector(`.check-btn[data-idx="${idx}"]`);
   btn.disabled = true;
   // Actualizar estado visual
   const statusSpan = document.querySelector(`#puzzle-${idx} .puzzle-status`);
   statusSpan.textContent = '✅ Resuelto';
   statusSpan.classList.add('solved');
   checkAllSolved();
  } else {
   feedbackDiv.style.display = 'block';
   feedbackDiv.innerHTML = `❌ Incorrecto: "${input.value}". Inténtalo de nuevo.`;
   feedbackDiv.style.color = '#ffaaaa';
  }
  // Auto-ocultar feedback después de 3 segundos
  setTimeout(() => {
   if (feedbackDiv.style.display === 'block') {
    feedbackDiv.style.display = 'none';
   }
  }, 3000);
 }

 function showHint(idx) {
  const feedbackDiv = document.getElementById(`feedback-${idx}`);
  feedbackDiv.style.display = 'block';
  feedbackDiv.innerHTML = `💡 Pista: ${puzzles[idx].hint}`;
  feedbackDiv.style.color = '#ffffaa';
  setTimeout(() => {
   if (feedbackDiv.style.display === 'block') {
    feedbackDiv.style.display = 'none';
   }
  }, 5000);
 }

 function checkAllSolved() {
  if (gameCompleted) return;
  if (solved.every(s => s === true)) {
   gameCompleted = true;
   if (timerInterval) clearInterval(timerInterval);
   // Mostrar mensaje final
   const finalDiv = document.createElement('div');
   finalDiv.className = 'final-message';
   finalDiv.id = 'finalMessage';
   finalDiv.innerHTML = `
    <i class="fas fa-crown" style="font-size: 3rem;"></i>
    <h2>¡ESCAPASTE! 🎉</h2>
    <p>Has resuelto todos los acertijos y dominas los fundamentos de blockchain.</p>
    <p>Eres oficialmente un <strong>Blockchain Escape Master</strong>.</p>
    <i class="fas fa-qrcode"></i> Código de honor: 0xE5C4P3
   `;
   escapeRoomDiv.appendChild(finalDiv);
   finalDiv.style.display = 'block';
   timerDisplaySpan.innerHTML = I18N.t('fb_1');
  }
 }

 // Temporizador
 function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
   if (gameCompleted) return;
   if (timerSeconds <= 0) {
    // Tiempo agotado
    clearInterval(timerInterval);
    timerDisplaySpan.innerHTML = I18N.t('fb_2');
    // Deshabilitar todos los inputs
    for (let i = 0; i < puzzles.length; i++) {
     const input = document.getElementById(`input-${i}`);
     if (input) input.disabled = true;
     const btn = document.querySelector(`.check-btn[data-idx="${i}"]`);
     if (btn) btn.disabled = true;
    }
    const failMsg = document.createElement('div');
    failMsg.className = 'final-message';
    failMsg.style.background = '#e74c3c';
    failMsg.innerHTML = I18N.t('fb_3');
    escapeRoomDiv.appendChild(failMsg);
    failMsg.style.display = 'block';
    gameCompleted = true;
   } else {
    timerSeconds--;
    const minutes = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    timerDisplaySpan.innerHTML = `⏱️ Tiempo restante: ${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
   }
  }, 1000);
 }

 function restartGame() {
  // Reiniciar estado
  solved = [false, false, false, false, false];
  gameCompleted = false;
  timerSeconds = 600;
  if (timerInterval) clearInterval(timerInterval);
  // Limpiar mensaje final si existe
  const finalMsg = document.getElementById('finalMessage');
  if (finalMsg) finalMsg.remove();
  // Volver a renderizar
  renderPuzzles();
  startTimer();
  timerDisplaySpan.innerHTML = `⏱️ Tiempo restante: 10:00`;
 }

 restartBtn.addEventListener('click', restartGame);

 // Inicializar
 renderPuzzles();
 startTimer();
</script>
 <script>
window.I18N_DATA={
 'fb_0': { es: '✅ ¡Correcto! Has desbloqueado este acertijo.', en: '✅ Correct! Has desbloqueado este acertijo.' },
 'fb_1': { es: '🎉 ¡COMPLETADO! 🎉', en: '🎉 ¡COMPLETADO! 🎉' },
 'fb_2': { es: '⏰ ¡TIEMPO AGOTADO! Reinicia el desafío.', en: '⏰ ¡TIEMPO AGOTADO! Reinicia el desafío.' },
 'fb_3': { es: '<i class="fas fa-skull"></i> Has quedado atrapado. Reinicia para intentarlo de nuevo.', en: '<i class="fas fa-skull"></i> Has quedado atrapado. Reinicia para intentarlo de nuevo.' }
};
</script>
</body>
