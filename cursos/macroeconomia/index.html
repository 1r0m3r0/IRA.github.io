<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Macroeconomía Interactiva | Menú del Curso</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:linear-gradient(135deg,#0a0f1e 0%,#0c1222 50%,#111a2e 100%); background-size:200% 200%; animation:gradientShift 20s ease infinite; font-family:'Inter',sans-serif; color:#eef5ff; min-height:100vh; padding:2rem 1rem; }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .hero { max-width:1300px; margin:0 auto; text-align:center; padding:2rem 1rem; }
    .hero h1 { font-size:3rem; font-weight:800; background:linear-gradient(135deg,#fff,#00e0ff,#2b9eff); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hero p { color:#99b8e0; margin-top:0.6rem; font-size:1.15rem; }
    .progress-container { max-width:1300px; margin:1.5rem auto 0; background:#0b1120cc; backdrop-filter:blur(8px); border-radius:2rem; padding:1.5rem 2rem; border:1px solid #2c3e66; }
    .progress-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
    .progress-header h3 { font-size:1rem; font-weight:600; }
    .progress-bar-bg { flex:1; min-width:200px; height:12px; background:#1a2a4a; border-radius:20px; overflow:hidden; }
    .progress-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#00e0ff,#2b9eff,#00ffc8); border-radius:20px; transition:width 0.6s ease; }
    .progress-text { font-weight:700; font-size:1.1rem; color:#00e0ff; min-width:60px; text-align:right; }
    .btn-continue { background:linear-gradient(95deg,#f0a500,#ff6a00); border:none; padding:0.9rem 2.5rem; font-weight:700; border-radius:3rem; cursor:pointer; font-size:1.1rem; transition:0.2s; color:#1e1a0c; margin-top:0.8rem; }
    .btn-continue:hover { transform:translateY(-3px); box-shadow:0 0 20px rgba(240,165,0,0.5); }
    .btn-continue:disabled { opacity:0.4; cursor:default; transform:none; box-shadow:none; }
    .track-section { max-width:1300px; margin:2rem auto; }
    .track-title { font-size:1.5rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:0.7rem; }
    .track-title .track-badge { background:#2c3e66; padding:0.2rem 0.8rem; border-radius:20px; font-size:0.8rem; font-weight:600; }
    .track-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
    .mod-card { background:rgba(15,25,45,0.7); backdrop-filter:blur(8px); border-radius:1.5rem; padding:1.2rem; border:1px solid #2c3e66; transition:0.2s; position:relative; overflow:hidden; text-decoration:none; color:#eef5ff; display:flex; flex-direction:column; }
    .mod-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,224,255,0.15); }
    .mod-card.completed { border-color:gold; }
    .mod-card.completed::after { content:'\2713'; position:absolute; top:0.5rem; right:0.8rem; font-size:1.5rem; color:gold; font-weight:bold; }
    .mod-card .num { font-size:0.75rem; font-weight:700; color:#99b8e0; letter-spacing:1px; }
    .mod-card .title { font-size:1rem; font-weight:600; margin-top:0.3rem; }
    .mod-card .desc { font-size:0.8rem; color:#99b8e0; margin-top:0.4rem; }
    .mod-card .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:0.4rem; }
    .mod-card .status-dot.pending { background:#555; }
    .mod-card .status-dot.done { background:gold; box-shadow:0 0 6px gold; }
    .mod-card.expert { border-color:#9933ff44; }
    .mod-card.expert .num { color:#b380ff; }
    footer { text-align:center; padding:1.5rem; font-size:0.8rem; color:#668; }
    @media (max-width:600px){ .hero h1 { font-size:2rem; } .track-grid { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="../../assets/css/theme.css">
</head>
<body>
  <nav class="brand-return-nav"><a href="../../index.html">&larr; Portfolio</a><a href="../../cursos/index.html">Cursos</a></nav>
  <div class="hero">
    <h1><i class="fas fa-chart-pie"></i> Macroeconomía Interactiva</h1>
    <p>Domina los agregados económicos · 16 módulos principales + 8 avanzados</p>
  </div>

  <div class="progress-container" id="progressContainer">
    <div class="progress-header">
      <h3><i class="fas fa-tasks"></i> Tu Progreso</h3>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0%</span>
    </div>
    <button class="btn-continue" id="btnContinue"><i class="fas fa-play"></i> Continuar Curso</button>
  </div>

  <div class="track-section">
    <div class="track-title"><i class="fas fa-layer-group" style="color:#00e0ff"></i> Módulos Principales <span class="track-badge">16</span></div>
    <div class="track-grid" id="mainGrid"></div>
  </div>

  <div class="track-section">
    <div class="track-title"><i class="fas fa-flask" style="color:#b380ff"></i> 🏆 Modo Experto <span class="track-badge">8</span></div>
    <div class="track-grid" id="expertGrid"></div>
  </div>

  <footer><i class="fas fa-crown"></i> Macroeconomía Interactiva · Universidad Mayor de San Andrés</footer>

  <script>
    const PAGE_KEYS = {
      '01-portal-inicio.html': { key: 'macro_lvl1', title: 'Portal de Inicio', num: '01', desc: 'Diagnóstico de conceptos macroeconómicos', track: 'main', icon: 'fa-rocket' },
      '02-medicion.html': { key: 'macro_lvl2', title: 'Medición Macroeconómica', num: '02', desc: 'PIB, inflación y deflactor', track: 'main', icon: 'fa-ruler' },
      '03-mercado-bienes.html': { key: 'macro_lvl3', title: 'Mercado de Bienes', num: '03', desc: 'Multiplicador keynesiano y equilibrio', track: 'main', icon: 'fa-store' },
      '04-dinero-bancos.html': { key: 'macro_lvl4', title: 'Dinero y Bancos', num: '04', desc: 'Multiplicador monetario y agregados', track: 'main', icon: 'fa-money-bill-wave' },
      '05-modelo-islm.html': { key: 'macro_lvl5', title: 'Modelo IS-LM', num: '05', desc: 'Equilibrio real y monetario', track: 'main', icon: 'fa-chart-line' },
      '06-mercado-trabajo.html': { key: 'macro_lvl6', title: 'Mercado de Trabajo', num: '06', desc: 'Desempleo y salarios', track: 'main', icon: 'fa-users' },
      '07-oferta-agregada.html': { key: 'macro_lvl7', title: 'Oferta Agregada', num: '07', desc: 'Producción y precios agregados', track: 'main', icon: 'fa-industry' },
      '08-inflacion-phillips.html': { key: 'macro_lvl8', title: 'Inflación y Phillips', num: '08', desc: 'Curva de Phillips y expectativas', track: 'main', icon: 'fa-fire' },
      '09-crecimiento-solow.html': { key: 'macro_lvl9', title: 'Crecimiento de Solow', num: '09', desc: 'Capital, trabajo y tecnología', track: 'main', icon: 'fa-chart-bar' },
      '10-crecimiento-endogeno.html': { key: 'macro_lvl10', title: 'Crecimiento Endógeno', num: '10', desc: 'I+D, capital humano e innovación', track: 'main', icon: 'fa-lightbulb' },
      '11-consumo-ahorro.html': { key: 'macro_lvl11', title: 'Consumo y Ahorro', num: '11', desc: 'Keynes, Fisher y ciclo vital', track: 'main', icon: 'fa-piggy-bank' },
      '12-inversion.html': { key: 'macro_lvl12', title: 'Inversión', num: '12', desc: 'Q de Tobin y acelerador', track: 'main', icon: 'fa-chart-simple' },
      '13-ciclos.html': { key: 'macro_lvl13', title: 'Ciclos Económicos', num: '13', desc: 'Expansión, recesión y recuperación', track: 'main', icon: 'fa-wave-square' },
      '14-economia-abierta.html': { key: 'macro_lvl14', title: 'Economía Abierta', num: '14', desc: 'Tipo de cambio y balanza de pagos', track: 'main', icon: 'fa-globe' },
      '15-politica-fiscal.html': { key: 'macro_lvl15', title: 'Política Fiscal', num: '15', desc: 'Gasto público, impuestos y déficit', track: 'main', icon: 'fa-landmark' },
      '16-certificado.html': { key: 'macro_lvl16', title: 'Certificado Final', num: '16', desc: 'Celebra tu logro macroeconómico', track: 'main', icon: 'fa-certificate' },
      'e1-crisis-financieras.html': { key: 'macro_e1', title: 'Crisis Financieras', num: 'E1', desc: 'Burbujas, pánicos y rescates', track: 'expert', icon: 'fa-chart-line' },
      'e2-modelos-dsge.html': { key: 'macro_e2', title: 'Modelos DSGE', num: 'E2', desc: 'Equilibrio general dinámico estocástico', track: 'expert', icon: 'fa-cogs' },
      'e3-politica-monetaria.html': { key: 'macro_e3', title: 'Política Monetaria', num: 'E3', desc: 'Reglas de Taylor y metas de inflación', track: 'expert', icon: 'fa-money-bill-trend-up' },
      'e4-desigualdad.html': { key: 'macro_e4', title: 'Desigualdad', num: 'E4', desc: 'Distribución del ingreso y riqueza', track: 'expert', icon: 'fa-scale-balanced' },
      'e5-economia-internacional.html': { key: 'macro_e5', title: 'Economía Internacional', num: 'E5', desc: 'Comercio, finanzas y globalización', track: 'expert', icon: 'fa-earth-americas' },
      'e6-cambio-climatico.html': { key: 'macro_e6', title: 'Cambio Climático', num: 'E6', desc: 'Externalidades y políticas verdes', track: 'expert', icon: 'fa-leaf' },
      'e7-finanzas-publicas.html': { key: 'macro_e7', title: 'Finanzas Públicas', num: 'E7', desc: 'Deuda soberana y sostenibilidad', track: 'expert', icon: 'fa-file-invoice' },
      'e8-fronteras.html': { key: 'macro_e8', title: 'Fronteras de la Macroeconomía', num: 'E8', desc: 'Nuevos enfoques y debates actuales', track: 'expert', icon: 'fa-rocket' }
    };
    const entries = Object.entries(PAGE_KEYS);
    function getProgress() {
      let completed = 0;
      for (const [,v] of entries) { if (localStorage.getItem(v.key)==='true') completed++; }
      return { completed, total: entries.length };
    }
    function render() {
      const { completed, total } = getProgress();
      const pct = total > 0 ? Math.round((completed/total)*100) : 0;
      document.getElementById('progressFill').style.width = pct+'%';
      document.getElementById('progressText').textContent = pct+'%';
      const btn = document.getElementById('btnContinue');
      if (completed === total) {
        btn.textContent = '\u{1F3C6} \u00a1Completado!';
        btn.disabled = true;
      } else {
        const first = entries.find(([,v]) => localStorage.getItem(v.key)!=='true');
        if (first) {
          btn.innerHTML = '<i class="fas fa-play"></i> Continuar: ' + first[1].title;
          btn.onclick = () => window.location.href = first[0];
        }
      }
      const mainGrid = document.getElementById('mainGrid');
      const expertGrid = document.getElementById('expertGrid');
      mainGrid.innerHTML = '';
      expertGrid.innerHTML = '';
      for (const [file, info] of entries) {
        const done = localStorage.getItem(info.key) === 'true';
        const card = document.createElement('a');
        card.className = 'mod-card' + (done ? ' completed' : '') + (info.track==='expert' ? ' expert' : '');
        card.href = file;
        card.innerHTML = '<div class="num">M\u00f3dulo ' + info.num + '</div><div class="title"><span class="status-dot ' + (done?'done':'pending') + '"></span>' + info.title + '</div><div class="desc">' + info.desc + '</div>';
        if (info.track==='expert') expertGrid.appendChild(card);
        else mainGrid.appendChild(card);
      }
    }
    render();
  </script>
  <script src="../../assets/js/cookie-consent.js"></script>
</body>
</html>
