<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="../../../favicon.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Curso 6: Introducción a Machine Learning | Ciencia de Datos I</title><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><link rel="stylesheet" href="../../../assets/css/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0f1e,#0c1222,#111a2e);font-family:'Inter',sans-serif;color:#eef5ff;min-height:100vh;padding:2rem 1rem}
.container{max-width:1100px;margin:4rem auto 0}
.hero{background:rgba(15,25,45,0.65);backdrop-filter:blur(12px);border-radius:3rem;border:1px solid rgba(255,215,0,0.25);overflow:hidden}
.hero-header{background:linear-gradient(95deg,#0b1120,#111a2e);padding:2.5rem 2rem 2rem;text-align:center;border-bottom:2px solid #ffd700}
.hero-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#FFF,#ffed8a,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-header p{color:#ffe680;margin-top:0.5rem}
.progress-box{margin-top:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
.progress-box .pt{display:flex;justify-content:space-between;font-size:0.85rem;color:#ffe680;margin-bottom:0.4rem;font-weight:600}
.progress-box .bt{height:10px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,215,0,0.15)}
.progress-box .bf{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ffe680);border-radius:10px;transition:width 0.6s ease}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:2rem}
.module-card{background:rgba(0,10,25,0.6);border-radius:1.5rem;padding:1.2rem;border:1px solid rgba(255,215,0,0.15);transition:0.3s;text-decoration:none;color:#eef5ff}
.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(255,215,0,0.15);border-color:#ffd700}
.module-card .num{background:#ffd700;color:#000;font-weight:800;border-radius:50%;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;font-size:0.85rem;margin-bottom:0.5rem}
.module-card h3{font-size:1rem;font-weight:600}
.module-card .status{font-size:0.8rem;margin-top:0.3rem;color:#8899bb}
footer{text-align:center;padding:1.2rem;font-size:0.8rem;border-top:1px solid #2c3e66;color:#8899bb}
</style>
</head>
<body>
<nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../index.html">Programa</a><a href="../../../cursos/index.html">Cursos</a></nav>
<div class="container">
<div class="hero">
<div class="hero-header">
<h1>🤖 Curso 6: Introducción a Machine Learning</h1>
<p>Pipeline · Regresión · Árboles · Random Forest · SVM · SHAP · Evaluación</p>
<div class="progress-box"><div class="pt"><span>Progreso</span><span id="pct">0%</span></div><div class="bt"><div class="bf" id="fill"></div></div></div>
</div>
<div class="module-grid" id="grid"></div>
<footer><i class="fas fa-graduation-cap"></i> Curso 6 · Ciencia de Datos I · 12 módulos</footer>
</div></div>
<script>
const MODS=[
{n:"01",t:"Pipeline de ML — EDA, splits, preprocesamiento, evaluación",f:"01-pipeline-de-ml-eda-splits-preprocesamiento-evaluacion.html"},
{n:"02",t:"Preprocesamiento — scalers, encoders, ColumnTransformer",f:"02-preprocesamiento-scalers-encoders-columntransformer.html"},
{n:"03",t:"Regresión Lineal y Regularizada — Ridge, Lasso, ElasticNet",f:"03-regresion-lineal-y-regularizada-ridge-lasso-elasticnet.html"},
{n:"04",t:"Regresión Logística — frontera, multiclase, regularización",f:"04-regresion-logistica-frontera-multiclase-regularizacion.html"},
{n:"05",t:"Árboles de Decisión — criterio, poda, feature importance",f:"05-arboles-de-decision-criterio-poda-feature-importance.html"},
{n:"06",t:"Random Forest — bagging, OOB, hiperparámetros clave",f:"06-random-forest-bagging-oob-hiperparametros-clave.html"},
{n:"07",t:"SVM — kernels, C, gamma, SVR",f:"07-svm-kernels-c-gamma-svr.html"},
{n:"08",t:"KNN — distancia, k óptimo, curse of dimensionality",f:"08-knn-distancia-k-optimo-curse-of-dimensionality.html"},
{n:"09",t:"Evaluación de Modelos — cross-val, ROC, F1, log-loss",f:"09-evaluacion-de-modelos-cross-val-roc-f1-log-loss.html"},
{n:"10",t:"Búsqueda de Hiperparámetros — GridSearch, Optuna",f:"10-busqueda-de-hiperparametros-gridsearch-optuna.html"},
{n:"11",t:"Interpretación con SHAP — Shapley values, summary plot",f:"11-interpretacion-con-shap-shapley-values-summary-plot.html"},
{n:"12",t:"Mini-Proyecto: Pipeline ML Completo con 5+ Modelos",f:"12-mini-proyecto-pipeline-ml-completo-con-5-modelos.html"}
];
const KEY="datos1_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
  const cid="curso-6-intro-machine-learning-m"+m.n;
  const d=done(cid);
  if(d)completed++;
  const card=document.createElement('a');card.className='module-card';card.href=m.f;
  card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'✅ Completado':'⬜ Pendiente'}</div>`;
  grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
</body>
</html>
