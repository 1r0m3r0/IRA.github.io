<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>TENPOMATIC | Gerencia General Integral</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <link rel="stylesheet" href="../../assets/css/theme.css">
 <style>
  :root {
   --accent-r: 255; --accent-g: 179; --accent-b: 71;
   --accent: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
   --accent-dim: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.15);
   --accent-glow: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.3);
   --bg-card: rgba(255,255,255,0.03);
   --border-card: rgba(255,255,255,0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
   font-family: 'Inter', sans-serif;
   background: #0a0e17;
   color: #e0e6f0;
   min-height: 100vh;
  }
  .course-container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .hero-section {
   text-align: center;
   padding: 40px 20px 30px;
   background: linear-gradient(135deg, rgba(255,179,71,0.08), rgba(255,179,71,0.02));
   border-radius: 20px;
   border: 1px solid rgba(255,179,71,0.1);
   margin-bottom: 28px;
  }
  .hero-section h1 {
   font-size: clamp(1.8rem, 5vw, 3rem);
   font-weight: 900;
   background: linear-gradient(135deg, var(--accent), #ffd700, #fff);
   -webkit-background-clip: text;
   -webkit-text-fill-color: transparent;
   background-clip: text;
   margin-bottom: 8px;
  }
  .hero-section .subtitle {
   font-size: 1rem;
   color: rgba(255,255,255,0.5);
   font-weight: 400;
  }
  .hero-section .badge {
   display: inline-block;
   margin-top: 12px;
   padding: 6px 18px;
   background: var(--accent-dim);
   border: 1px solid var(--accent);
   border-radius: 20px;
   color: var(--accent);
   font-size: 0.75rem;
   font-weight: 700;
   letter-spacing: 0.5px;
  }
  .player-section {
   display: flex;
   flex-wrap: wrap;
   gap: 12px;
   align-items: center;
   justify-content: center;
   margin-bottom: 24px;
  }
  .player-section input {
   background: rgba(255,255,255,0.06);
   border: 1px solid rgba(255,255,255,0.1);
   border-radius: 8px;
   padding: 10px 14px;
   color: #fff;
   font-size: 14px;
   font-family: 'Inter', sans-serif;
   width: 220px;
   outline: none;
   transition: 0.2s;
  }
  .player-section input:focus {
   border-color: var(--accent);
   box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .player-section .btn-save {
   background: var(--accent);
   color: #0a0e17;
   border: none;
   padding: 10px 20px;
   border-radius: 8px;
   font-weight: 600;
   cursor: pointer;
   font-size: 13px;
   transition: 0.2s;
  }
  .player-section .btn-save:hover {
   transform: translateY(-2px);
   box-shadow: 0 6px 20px var(--accent-glow);
  }
  .global-progress {
   background: rgba(255,255,255,0.04);
   border: 1px solid rgba(255,255,255,0.06);
   border-radius: 14px;
   padding: 20px 24px;
   margin-bottom: 28px;
  }
  .global-progress .progress-header {
   display: flex;
   justify-content: space-between;
   font-size: 14px;
   color: rgba(255,255,255,0.6);
   margin-bottom: 10px;
  }
  .global-progress .progress-header span strong { color: var(--accent); }
  .progress-track {
   height: 10px;
   background: rgba(255,255,255,0.06);
   border-radius: 10px;
   overflow: hidden;
   position: relative;
  }
  .progress-track .progress-fill {
   height: 100%;
   background: linear-gradient(90deg, var(--accent), #ffd700);
   border-radius: 10px;
   transition: width 0.6s ease;
   width: 0%;
  }
  .section-title {
   font-size: 1.3rem;
   font-weight: 800;
   margin: 32px 0 16px;
   display: flex;
   align-items: center;
   gap: 10px;
  }
  .section-title i { color: var(--accent); }
  .section-title .count {
   font-size: 0.8rem;
   color: rgba(255,255,255,0.35);
   font-weight: 400;
   margin-left: 4px;
  }
  .modules-grid {
   display: grid;
   grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
   gap: 14px;
  }
  .module-card {
   background: var(--bg-card);
   border: 1px solid var(--border-card);
   border-radius: 14px;
   padding: 16px 18px;
   transition: all 0.3s ease;
   position: relative;
   overflow: hidden;
   cursor: pointer;
   text-decoration: none;
   display: block;
   color: inherit;
  }
  .module-card:hover {
   border-color: var(--accent-dim);
   transform: translateY(-3px);
   box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }
  .module-card .card-top {
   display: flex;
   justify-content: space-between;
   align-items: flex-start;
   margin-bottom: 8px;
  }
  .module-card .module-num {
   font-size: 0.7rem;
   font-weight: 700;
   color: var(--accent);
   background: var(--accent-dim);
   padding: 3px 10px;
   border-radius: 6px;
   letter-spacing: 0.5px;
  }
  .module-card .check-badge {
   font-size: 1.1rem;
   opacity: 0.3;
   transition: 0.3s;
  }
  .module-card .check-badge.completed {
   opacity: 1;
   color: #00ffc8;
  }
  .module-card h3 {
   font-size: 0.95rem;
   font-weight: 700;
   margin-bottom: 4px;
   line-height: 1.3;
  }
  .module-card p {
   font-size: 0.8rem;
   color: rgba(255,255,255,0.45);
   line-height: 1.4;
  }
  .module-card .card-footer {
   display: flex;
   justify-content: space-between;
   align-items: center;
   margin-top: 10px;
   font-size: 0.7rem;
   color: rgba(255,255,255,0.25);
  }
  .module-card .card-footer i { margin-right: 4px; }
  .module-card.expert {
   border-left: 3px solid rgb(255,102,192);
  }
  .module-card.expert .module-num {
   background: rgba(255,102,192,0.15);
   color: rgb(255,102,192);
  }
  .module-card.roleplay {
   border-left: 3px solid rgb(255,215,0);
   background: rgba(255,215,0,0.04);
  }
  .module-card.roleplay .module-num {
   background: rgba(255,215,0,0.15);
   color: rgb(255,215,0);
  }
  .reset-section {
   text-align: center;
   margin: 32px 0;
   padding: 20px;
   border-top: 1px solid rgba(255,255,255,0.04);
  }
  .reset-btn {
   background: rgba(255,80,80,0.1);
   border: 1px solid rgba(255,80,80,0.2);
   color: #ff6666;
   padding: 8px 20px;
   border-radius: 8px;
   font-size: 12px;
   cursor: pointer;
   transition: 0.2s;
   font-family: 'Inter', sans-serif;
  }
  .reset-btn:hover {
   background: rgba(255,80,80,0.2);
  }
  footer {
   text-align: center;
   padding: 28px 0 12px;
   border-top: 1px solid rgba(255,255,255,0.04);
   color: rgba(255,255,255,0.2);
   font-size: 12px;
  }
  footer i { color: var(--accent); margin-right: 6px; }
  @media(max-width:640px) {
   .modules-grid { grid-template-columns: 1fr; }
   .player-section { flex-direction: column; }
  }
 
.objectives { background: rgba(0,224,255,0.1); border-radius: 1.5rem; padding: 1rem 1.5rem; margin: 1.5rem 2rem; border: 1px solid rgba(0,224,255,0.3); }
.objectives h3 { color: #00e0ff; font-size: 1.1rem; margin-bottom: 0.7rem; }
.objectives li { color: #b9ccee; font-size: 0.9rem; margin: 0.4rem 0; list-style: none; }
.objectives li::before { content: "🎯 "; }
.module-recap { background: rgba(0,224,255,0.08); border-radius: 1.5rem; padding: 1rem 1.5rem; margin: 1.5rem 2rem; border: 1px dashed rgba(0,224,255,0.4); }
.module-recap h3 { color: #00e0ff; font-size: 1rem; margin-bottom: 0.5rem; }
.module-recap li { color: #8899bb; font-size: 0.85rem; margin: 0.3rem 0; }
</style>
</head>
<body>
 <nav class="brand-return-nav">
  <a href="../../index.html">&larr; Portfolio</a>
  <a href="../../cursos/index.html">Cursos</a>
  <a href="index.html">TENPOMATIC</a>
 </nav>
 <div class="course-container">
  <div class="hero-section">
   <h1>&#x1F3ED; TENPOMATIC</h1>
   <p class="subtitle">Gerencia General Integral &mdash; Simulador LABSAG</p>
   <span class="badge"><i class="fas fa-cube"></i> 35 M&oacute;dulos &middot; 25 Principales + 10 Experto</span>
  </div>

  <div class="player-section">
   <input type="text" id="playerName" placeholder="Tu nombre, gerente..." maxlength="30">
   <button class="btn-save" onclick="saveName()"><i class="fas fa-user"></i> Guardar</button>
   <span id="greeting" style="font-size:13px;color:rgba(255,255,255,0.4);"></span>
  </div>

  <div class="global-progress">
   <div class="progress-header">
    <span>Tu progreso global</span>
    <span id="progressText"><strong>0</strong> de 35 m&oacute;dulos (<strong>0%</strong>)</span>
   </div>
   <div class="progress-track">
    <div class="progress-fill" id="globalFill" style="width:0%"></div>
   </div>
  </div>

  <div class="section-title">
   <i class="fas fa-route"></i> Curso Principal <span class="count">(25 m&oacute;dulos)</span>
  </div>
  <div class="modules-grid" id="mainGrid"></div>

  <div class="section-title" style="margin-top:40px;">
   <i class="fas fa-crown"></i> Modo Experto <span class="count">(10 m&oacute;dulos)</span>
  </div>
  <div class="modules-grid" id="expertGrid"></div>

  <div class="reset-section">
   <button class="reset-btn" onclick="resetProgress()"><i class="fas fa-trash-alt"></i> Reiniciar progreso</button>
  </div>

  <footer>
   <i class="fas fa-chart-line"></i> TENPOMATIC &middot; Gerencia General Integral &middot; Basado en LABSAG
  </footer>
 </div>

 <script>
  const COURSE_PROGRESS_KEY = 'tenpomatic_progress';
  const PLAYER_NAME_KEY = 'tenpomatic_player';

  const MAIN_MODULES = [
   { n: 1, t: 'Portal de Inicio',       d: 'Diagn&oacute;stico, bienvenida y configuraci&oacute;n del curso',            f: '01-portal-inicio.html', icon: 'fa-door-open' },
   { n: 2, t: 'Universo TENPOMATIC',      d: 'Visi&oacute;n general de la simulaci&oacute;n, objetivos y ciclo gerencial',     f: '02-universo-tenpomatic.html', icon: 'fa-globe' },
   { n: 3, t: 'Historia y Pol&iacute;ticas',  d: 'Fundaci&oacute;n de la empresa, accionistas y pol&iacute;ticas del directorio',    f: '03-historia-politicas.html', icon: 'fa-book' },
   { n: 4, t: 'Mercado y 3 &Aacute;reas',    d: 'Tres &aacute;reas geogr&aacute;ficas, pron&oacute;sticos de ventas y esfuerzo',   f: '04-mercado-3-areas.html', icon: 'fa-map-marked-alt' },
   { n: 5, t: 'Compra de Kits',         d: 'Materia prima, descuentos por volumen y riesgo de proveedor 7%',           f: '05-compra-kits.html', icon: 'fa-cubes' },
   { n: 6, t: 'Fuerza Laboral',         d: 'Cuadrillas de 3, contrataci&oacute;n, despido, rotaci&oacute;n 1/20 y sobretiempo', f: '06-fuerza-laboral.html', icon: 'fa-users-gear' },
   { n: 7, t: 'Planta y Capacidad',       d: 'Construir vs comprar planta, expansi&oacute;n y depreciaci&oacute;n 5%',       f: '07-planta-capacidad.html', icon: 'fa-industry' },
   { n: 8, t: 'Costo de Producci&oacute;n',   d: 'Material directo, MOD, CIF, depreciaci&oacute;n y COGS con datos del T8',      f: '08-costo-produccion.html', icon: 'fa-calculator' },
   { n: 9, t: 'Almac&eacute;n y Transferencias', d: 'Inventario PT, transferencias $4/unidad y ventas perdidas',            f: '09-almacen-transferencias.html', icon: 'fa-warehouse' },
   { n: 10, t: 'Publicidad Nacional y Local',   d: '$3K vs $900, alcance 3T vs 1T, rendimientos decrecientes',             f: '10-publicidad-nacional-local.html', icon: 'fa-bullhorn' },
   { n: 11, t: 'Fuerza de Ventas',        d: 'Contrataci&oacute;n $4,600, 2T training, asignaci&oacute;n &aacute;reas',      f: '11-fuerza-ventas.html', icon: 'fa-handshake' },
   { n: 12, t: 'Mejora de Producto',       d: '$10K c/u, m&aacute;x 3/trimestre, efectos acumulativos',              f: '12-mejora-producto.html', icon: 'fa-flask' },
   { n: 13, t: 'Tarjeta 1 &mdash; Precio y Mix', d: 'Precio $34-47, publicidad, vendedores y mejoras',                  f: '13-tarjeta-1-precio.html', icon: 'fa-tag' },
   { n: 14, t: 'Tarjeta 2 &mdash; Transf. y Prod',d: 'Unidades a transferir entre &aacute;reas y producci&oacute;n total',        f: '14-tarjeta-2-transferencias.html', icon: 'fa-truck' },
   { n: 15, t: 'Tarjeta 3 &mdash; Materiales',  d: 'Pedido kits, construir planta, pr&eacute;stamo CP y dividendos',          f: '15-tarjeta-3-materiales.html', icon: 'fa-file-invoice' },
   { n: 16, t: 'Tarjetas 4-6 &mdash; Bonos, Acciones y Planta', d: 'Emitir/retirar bonos y acciones, comprar/vender planta',       f: '16-tarjetas-4-6-bonos-acciones.html', icon: 'fa-chart-pie' },
   { n: 17, t: 'Flujo de Caja',          d: 'Cobranzas 10/50/40, pr&eacute;stamos CP, tasa flotante y pron&oacute;stico',    f: '17-flujo-caja.html', icon: 'fa-money-bill-wave' },
   { n: 18, t: 'Estado de Resultados',      d: 'Costeo por absorci&oacute;n, impuestos 50% y p&eacute;rdidas carryback/forward',  f: '18-estado-resultados.html', icon: 'fa-file-alt' },
   { n: 19, t: 'Balance General',         d: 'Activos, pasivos, capital, precio de la acci&oacute;n y su f&oacute;rmula',    f: '19-balance-general.html', icon: 'fa-scale-balanced' },
   { n: 20, t: 'Informaci&oacute;n Ambiental',  d: '9 tipos de estudios de mercado, costos e inteligencia competitiva',         f: '20-informacion-ambiental.html', icon: 'fa-binoculars' },
   { n: 21, t: 'CONSEJO DE GERENCIA',       d: 'Juego de roles: Marketing, Finanzas, Operaciones y Talento Humano',        f: '21-consejo-gerencia.html', icon: 'fa-people-group', rp: true },
   { n: 22, t: 'Estrategia Integrada',       d: 'Escape room gerencial con 5 acertijos basados en datos reales',           f: '22-estrategia-integradora.html', icon: 'fa-puzzle-piece' },
   { n: 23, t: 'Plan de Gesti&oacute;n Integral', d: 'Plan completo en 6 pasos con descarga PDF usando jsPDF',              f: '23-plan-gestion.html', icon: 'fa-file-pdf' },
   { n: 24, t: 'Informe Final a Directores',   d: 'Reporte ejecutivo con gr&aacute;ficos canvas y recomendaciones',          f: '24-informe-final.html', icon: 'fa-chart-simple' },
   { n: 25, t: 'Cierre y Evaluaci&oacute;n',   d: 'Quiz final de 20 preguntas y certificado de finalizaci&oacute;n',          f: '25-cierre-evaluacion.html', icon: 'fa-certificate' },
  ];

  const EXPERT_MODULES = [
   { n: 26, t: 'An&aacute;lisis Costo-Volumen-Utilidad',      d: 'Punto de equilibrio y margen de contribuci&oacute;n',       f: 'e1-cvu.html', icon: 'fa-chart-line' },
   { n: 27, t: 'Pron&oacute;stico Avanzado de Ventas',       d: 'Regresi&oacute;n lineal con datos hist&oacute;ricos T1-T8',     f: 'e2-pronostico-ventas.html', icon: 'fa-chart-scatter' },
   { n: 28, t: 'Optimizaci&oacute;n de Producci&oacute;n',      d: 'Asignaci&oacute;n &oacute;ptima de cuadrillas y recursos',     f: 'e3-optimizacion-produccion.html', icon: 'fa-microchip' },
   { n: 29, t: 'Estrategias de Precios Din&aacute;micos',      d: 'Elasticidad precio-demanda y posicionamiento',           f: 'e4-estrategia-precios.html', icon: 'fa-dollar-sign' },
   { n: 30, t: 'Gesti&oacute;n de Inventarios y Cadena',      d: 'EOQ, stock de seguridad y rotaci&oacute;n de inventarios',     f: 'e5-gestion-inventarios.html', icon: 'fa-boxes-stacked' },
   { n: 31, t: 'An&aacute;lisis de Razones Financieras',      d: 'DuPont, liquidez, endeudamiento y rentabilidad',          f: 'e6-razones-financieras.html', icon: 'fa-percent' },
   { n: 32, t: 'Estructura de Capital y WACC',           d: 'Costo de capital, escenarios deuda/equity y apalancamiento',    f: 'e7-estructura-capital.html', icon: 'fa-building-columns' },
   { n: 33, t: 'Presentaci&oacute;n Ejecutiva',           d: 'Template profesional para consejo directivo con PDF',        f: 'e8-presentacion-ejecutiva.html', icon: 'fa-presentation' },
   { n: 34, t: 'Examen de Certificaci&oacute;n',          d: '40 preguntas, timer 30 min y certificado PDF personalizado',    f: 'e9-examen-certificacion.html', icon: 'fa-graduation-cap' },
   { n: 35, t: 'Pr&aacute;ctica Libre &mdash; 8 Periodos',     d: 'Simulaci&oacute;n completa de decisi&oacute;n en 8 rondas',     f: 'e10-practica-simulacion.html', icon: 'fa-arrows-spin' },
  ];

  function saveName() {
   const name = document.getElementById('playerName').value.trim();
   if (name) {
    localStorage.setItem(PLAYER_NAME_KEY, name);
    document.getElementById('greeting').textContent = name + ' listo para liderar';
   }
  }
  function loadName() {
   const saved = localStorage.getItem(PLAYER_NAME_KEY);
   if (saved) {
    document.getElementById('playerName').value = saved;
    document.getElementById('greeting').textContent = saved + ' listo para liderar';
   }
  }

  function updateGlobalProgress() {
   const p = JSON.parse(localStorage.getItem(COURSE_PROGRESS_KEY)) || [];
   const total = MAIN_MODULES.length + EXPERT_MODULES.length;
   const count = p.length;
   const pct = Math.round((count / total) * 100);
   document.getElementById('globalFill').style.width = pct + '%';
   document.getElementById('progressText').innerHTML = '<strong>' + count + '</strong> de ' + total + ' m&oacute;dulos (<strong>' + pct + '%</strong>)';
  }

  function renderCards() {
   const p = JSON.parse(localStorage.getItem(COURSE_PROGRESS_KEY)) || [];
   const mainGrid = document.getElementById('mainGrid');
   const expertGrid = document.getElementById('expertGrid');

   MAIN_MODULES.forEach(m => {
    const done = p.includes(m.n.toString());
    const cls = 'module-card' + (m.rp ? ' roleplay' : '');
    mainGrid.innerHTML += '<a href="' + m.f + '" class="' + cls + '">' +
     '<div class="card-top">' +
      '<span class="module-num"><i class="fas ' + m.icon + '"></i> M&oacute;dulo ' + m.n + '</span>' +
      '<span class="check-badge' + (done ? ' completed' : '') + '"><i class="fas fa-' + (done ? 'check-circle' : 'circle') + '"></i></span>' +
     '</div>' +
     '<h3>' + m.t + '</h3>' +
     '<p>' + m.d + '</p>' +
     '<div class="card-footer"><span><i class="fas fa-clock"></i> 15-20 min</span></div>' +
    '</a>';
   });

   EXPERT_MODULES.forEach(m => {
    const done = p.includes(m.n.toString());
    expertGrid.innerHTML += '<a href="' + m.f + '" class="module-card expert">' +
     '<div class="card-top">' +
      '<span class="module-num"><i class="fas ' + m.icon + '"></i> Expert ' + (m.n - 25) + '</span>' +
      '<span class="check-badge' + (done ? ' completed' : '') + '"><i class="fas fa-' + (done ? 'check-circle' : 'circle') + '"></i></span>' +
     '</div>' +
     '<h3>' + m.t + '</h3>' +
     '<p>' + m.d + '</p>' +
     '<div class="card-footer"><span><i class="fas fa-clock"></i> 20-30 min</span></div>' +
    '</a>';
   });
  }

  function resetProgress() {
   if (confirm('\u00bfReiniciar todo tu progreso en TENPOMATIC? Esta accio\u00f3n no se puede deshacer.')) {
    localStorage.removeItem(COURSE_PROGRESS_KEY);
    updateGlobalProgress();
    location.reload();
   }
  }

  window.addEventListener('load', function() {
   loadName();
   updateGlobalProgress();
   renderCards();
  });
 </script>
 </body>
</html>
