<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0f1e,#0c1222,#111a2e);font-family:'Inter',sans-serif;color:#eef5ff;min-height:100vh;padding:2rem 1rem}
.container{max-width:1100px;margin:4rem auto 0}
.hero{background:rgba(15,25,45,0.65);backdrop-filter:blur(12px);border-radius:3rem;border:1px solid rgba(255,179,71,0.25);overflow:hidden}
.hero-header{background:linear-gradient(95deg,#0b1120,#111a2e);padding:2.5rem 2rem 2rem;text-align:center;border-bottom:2px solid #ffb347}
.hero-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#FFF,#ffcc80,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-header p{color:#ffcc80;margin-top:0.5rem}
.progress-box{margin-top:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
.progress-box .pt{display:flex;justify-content:space-between;font-size:0.85rem;color:#ffcc80;margin-bottom:0.4rem;font-weight:600}
.progress-box .bt{height:10px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,179,71,0.15)}
.progress-box .bf{height:100%;width:0%;background:linear-gradient(90deg,#ffb347,#ffcc80,#ffa07a);border-radius:10px;transition:width 0.6s ease}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:2rem}
.module-card{background:rgba(0,10,25,0.6);border-radius:1.5rem;padding:1.2rem;border:1px solid rgba(255,179,71,0.15);transition:0.3s;text-decoration:none;color:#eef5ff}
.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(255,179,71,0.15);border-color:#ffb347}
.module-card .num{background:#ffb347;color:#000;font-weight:800;border-radius:50%;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;font-size:0.85rem;margin-bottom:0.5rem}
.module-card h3{font-size:1rem;font-weight:600}
.module-card .status{font-size:0.8rem;margin-top:0.3rem;color:#8899bb}
footer{text-align:center;padding:1.2rem;font-size:0.8rem;border-top:1px solid #2c3e66;color:#8899bb}
</style>
</head>
<body>
<nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../index.html">Programa</a><a href="../../../cursos/index.html">Cursos</a></nav>
<div class="container">
<div class="hero">
<div class="hero-header">
<h1>&#x1F4CA; Curso 3: Data Science para Marketing Analytics</h1>
<p>RFM, CLV, churn, sistemas de recomendaci&oacute;n y atribuci&oacute;n multicanal</p>
<div class="progress-box"><div class="pt"><span>Progreso</span><span id="pct">0%</span></div><div class="bt"><div class="bf" id="fill"></div></div></div>
</div>
<div class="module-grid" id="grid"></div>
<footer><i class="fas fa-graduation-cap"></i> Marketing Analytics &middot; 12 m&oacute;dulos</footer>
</div></div>
<script>
const MODS=[
{n:"01",t:"RFM y Segmentaci&oacute;n &mdash; Recency, Frequency, Monetary",f:"01-rfm-segmentacion.html"},
{n:"02",t:"Customer Lifetime Value &mdash; BG/NBD, Gamma-Gamma",f:"02-clv.html"},
{n:"03",t:"Churn Prediction &mdash; Survival, XGBoost, Retention",f:"03-churn-prediction.html"},
{n:"04",t:"Market Basket &mdash; Apriori, FP-Growth, Rules",f:"04-market-basket.html"},
{n:"05",t:"Recommendation Systems &mdash; SVD, NCF, Two-Tower",f:"05-recommendation-systems.html"},
{n:"06",t:"A/B Testing Marketing &mdash; Bayesian, CUPED, Sequential",f:"06-ab-testing.html"},
{n:"07",t:"Media Mix Modeling &mdash; Pyro-Marketing, Adstock",f:"07-media-mix-modeling.html"},
{n:"08",t:"Attribution Modeling &mdash; Multi-touch, Shapley",f:"08-attribution-modeling.html"},
{n:"09",t:"Customer Segmentation Avanzada &mdash; Embeddings, HDBSCAN",f:"09-customer-segmentacion-avanzada.html"},
{n:"10",t:"NLP para Marketing &mdash; Sentiment, BERTopic",f:"10-nlp-marketing.html"},
{n:"11",t:"Look-alike Modeling &mdash; Propensity, FAISS",f:"11-look-alike.html"},
{n:"12",t:"Mini-Proyecto: Customer Analytics Completo",f:"12-mini-proyecto.html"}
];
const KEY="datos4_c3_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
const cid="c3-m"+m.n;
const d=done(cid);
if(d)completed++;
const card=document.createElement('a');card.className='module-card';card.href=m.f;
card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'&#x2705; Completado':'&#x25FB; Pendiente'}</div>`;
grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
<script src="../../../assets/js/i18n.js"></script>  </body>
</html>
