<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programa Ciencia de Datos IV — Aplicaciones | Menú del Programa</title>
  <meta property="og:title" content="Programa Ciencia de Datos IV — Aplicaciones | Menú del Programa">
  <meta property="og:description" content="Programa completo de 3 cursos: NLP en Producción, Visión Computacional, y Data Science Multi-Industria. 36 módulos interactivos con insignias y certificado.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 50%, #111a2e 100%);
      font-family: 'Inter', sans-serif; color: #eef5ff; min-height: 100vh;
      padding: 2rem 1rem;
    }
    .brand-return-nav {
      display: flex; gap: 1rem; align-items: center; padding: 0.5rem 1rem;
      background: #0f1429; border: 1px solid rgba(0,224,255,0.2); border-radius: 0.5rem;
      font-family: 'Inter', sans-serif; position: fixed; top: 0.75rem; left: 0.75rem; z-index: 9999;
    }
    .brand-return-nav a { color: #00e0ff; text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .brand-return-nav a:hover { color: #00ff41; }
    .container { max-width: 1300px; width: 100%; margin: 0 auto; }
    .hero {
      background: rgba(15,25,45,0.65); backdrop-filter: blur(12px); border-radius: 3rem;
      border: 1px solid rgba(0,224,255,0.25); box-shadow: 0 25px 45px rgba(0,0,0,0.5);
      overflow: hidden; margin-top: 2rem;
    }
    .hero-header {
      background: linear-gradient(95deg, #0b1120, #111a2e); padding: 2.5rem 2rem 2rem;
      text-align: center; border-bottom: 2px solid #00e0ff;
    }
    .hero-header h1 { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg,#FFF,#7af2ff,#2b9eff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-header p { font-size: 1.1rem; color: #b9e2ff; margin-top: 0.5rem; }
    .progress-summary { margin-top: 1.5rem; max-width: 600px; margin-left: auto; margin-right: auto; }
    .progress-summary .bar-track { height: 10px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,224,255,0.15); }
    .progress-summary .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#00e0ff,#2b9eff,#7af2ff); border-radius: 10px; transition: width 0.6s ease; }
    .progress-stats { display: flex; justify-content: space-between; font-size: 0.85rem; color: #b9e2ff; margin-bottom: 0.4rem; font-weight: 600; }
    .courses-grid { display: flex; flex-direction: column; gap: 1.5rem; padding: 2rem; }
    .course-card {
      background: rgba(0,10,25,0.6); border-radius: 2rem; padding: 1.5rem;
      border: 1px solid rgba(0,224,255,0.2); transition: 0.3s;
    }
    .course-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,224,255,0.15); }
    .course-card h2 { font-size: 1.3rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.6rem; }
    .course-card p { color: #b4bcd0; font-size: 0.9rem; margin-bottom: 1rem; }
    .course-card .modules { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .course-card .modules a {
      display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.35rem 0.7rem;
      background: rgba(0,224,255,0.08); border-radius: 0.8rem; text-decoration: none;
      color: #b9e2ff; font-size: 0.8rem; font-weight: 500; transition: 0.2s;
    }
    .course-card .modules a:hover { background: rgba(0,224,255,0.2); color: #fff; }
    .course-card .modules a .badge { font-size: 0.7rem; }
    footer { text-align: center; padding: 1.2rem; font-size: 0.8rem; border-top: 1px solid #2c3e66; color: #8899bb; }
    @media (max-width:800px){ .hero-header h1 { font-size: 1.8rem; } }
  </style>
</head>
<body>
  <nav class="brand-return-nav"><a href="../../index.html">&larr; Portfolio</a><a href="../../cursos/index.html">Cursos</a></nav>
  <div class="container">
    <div class="hero">
      <div class="hero-header">
        <h1>🧠 Programa Ciencia de Datos IV — Aplicaciones y Casos Reales</h1>
        <p>3 cursos · 36 módulos interactivos · NLP · Visión · Multi-Industria</p>
        <div class="progress-summary">
          <div class="progress-stats"><span>📊 Progreso global</span><span id="globalPct">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="globalFill"></div></div>
          <div style="font-size:0.78rem;color:#8899bb;margin-top:0.3rem" id="globalDetail">0 de 36 módulos completados</div>
        </div>
      </div>
      <div class="courses-grid" id="coursesContainer"></div>
      <footer><i class="fas fa-brain"></i> Programa Ciencia de Datos IV — Aplicaciones · Aprendizaje Activo · 3 cursos · 36 módulos</footer>
    </div>
  </div>
  <script>
    const COURSES = [
      { slug: "curso-4-nlp-produccion", title: "Curso 4: NLP en Producción", icon: "💬", color: "#2b9eff", modules: [
        { n:"01", t:"Text Processing Pipeline — spaCy, tokenización, POS, NER" },
        { n:"02", t:"Text Classification — BERT, RoBERTa, SetFit" },
        { n:"03", t:"Sentiment Analysis — fine-grained, aspect-based" },
        { n:"04", t:"NER en Producción — BERT-NER, custom entities" },
        { n:"05", t:"Summarization — BART, Pegasus, Longformer" },
        { n:"06", t:"Question Answering — extractive, generative, RAG" },
        { n:"07", t:"Chatbots — Rasa, LangChain agent, memoria" },
        { n:"08", t:"Voice Assistants — Whisper STT, Coqui TTS" },
        { n:"09", t:"Document Parsing — PyMuPDF, Unstructured, Docling" },
        { n:"10", t:"Translation — MarianMT, NLLB, COMET" },
        { n:"11", t:"TF Serving NLP — batching, latency, A/B" },
        { n:"12", t:"Mini-Proyecto: Chatbot RAG + Whisper + FastAPI" }
      ]},
      { slug: "curso-5-vision-produccion", title: "Curso 5: Visión en Producción", icon: "👁️", color: "#ff5050", modules: [
        { n:"01", t:"Clasificación Producción — TF Data, augmentation, AMP" },
        { n:"02", t:"YOLOv11 — entrenamiento, hyperparameter evolution" },
        { n:"03", t:"Object Detection Serving — TF Serving, NMS, batching" },
        { n:"04", t:"Segmentación — SAM, YOLO seg, instance/panoptic" },
        { n:"05", t:"OCR Pipeline — TrOCR, PaddleOCR, layout analysis" },
        { n:"06", t:"Edge Deployment — TFLite, ONNX, TensorRT, quantization" },
        { n:"07", t:"Video Analytics — tracking, scene detection, counting" },
        { n:"08", t:"Face Recognition — ArcFace, FaceNet, liveness" },
        { n:"09", t:"Anomaly Detection Visual — PatchCore, SPADE" },
        { n:"10", t:"Multi-modal — CLIP, BLIP, image+text retrieval" },
        { n:"11", t:"Model Optimization — pruning, distillation, TensorRT" },
        { n:"12", t:"Mini-Proyecto: Visión Real-Time YOLO + Tracking" }
      ]},
      { slug: "curso-6-multi-industria", title: "Curso 6: Data Science Multi-Industria", icon: "🏭", color: "#00e0ff", modules: [
        { n:"01", t:"Energía — smart grid, IoT anomalías, forecasting" },
        { n:"02", t:"E-commerce — ranking, personalización, multi-modal" },
        { n:"03", t:"Logística — routing OR-Tools, demand forecast" },
        { n:"04", t:"RRHH — attrition, candidate matching, skills gap" },
        { n:"05", t:"IoT — predictive maintenance, RUL, edge ML" },
        { n:"06", t:"Gaming — churn, matchmaking, cheating detection" },
        { n:"07", t:"LegalTech — contract analysis, NER legal, e-discovery" },
        { n:"08", t:"InsurTech — claims, risk scoring, pricing GLM" },
        { n:"09", t:"EdTech — performance prediction, adaptive learning" },
        { n:"10", t:"AgTech — crop yield, satélite, soil, precision ag" },
        { n:"11", t:"Caso Integrador — framework solución transversal" },
        { n:"12", t:"Proyecto Final — portafolio 3 proyectos Data Science" }
      ]}
    ];
    const PROGRESS_KEY = "datos4_progress";
    function getProgress(){ return JSON.parse(localStorage.getItem(PROGRESS_KEY))||[]; }
    function isCompleted(modId){ return getProgress().includes(modId); }
    function render(){
      const container = document.getElementById('coursesContainer');
      let totalCompleted = 0;
      COURSES.forEach(c => {
        const card = document.createElement('div'); card.className = 'course-card';
        const modLinks = c.modules.map(m => {
          const mid = c.slug+"-m"+m.n;
          const done = isCompleted(mid);
          if(done) totalCompleted++;
          return `<a href="${c.slug}/${m.n}-${m.t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'')}.html">${done?'✅':'⬜'} ${m.n}. ${m.t}</a>`;
        }).join('');
        card.innerHTML = `<h2 style="color:${c.color}">${c.icon} ${c.title}</h2><p>12 módulos interactivos</p><div class="modules">${modLinks}</div>`;
        container.appendChild(card);
      });
      const pct = Math.round((totalCompleted/36)*100);
      document.getElementById('globalPct').textContent = pct+'%';
      document.getElementById('globalFill').style.width = pct+'%';
      document.getElementById('globalDetail').textContent = totalCompleted+' de 36 módulos completados';
    }
    render();
  </script>
</body>
</html>
