<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0f1e,#0c1222,#111a2e);font-family:'Inter',sans-serif;color:#eef5ff;min-height:100vh;padding:2rem 1rem}
.container{max-width:1100px;margin:4rem auto 0}
.hero{background:rgba(15,25,45,0.65);backdrop-filter:blur(12px);border-radius:3rem;border:1px solid rgba(255,215,0,0.25);overflow:hidden}
.hero-header{background:linear-gradient(95deg,#0b1120,#111a2e);padding:2.5rem 2rem 2rem;text-align:center;border-bottom:2px solid #ffd700}
.hero-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#FFF,#ffed4a,#ffd700);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-header p{color:#ffe08a;margin-top:0.5rem}
.progress-box{margin-top:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
.progress-box .pt{display:flex;justify-content:space-between;font-size:0.85rem;color:#ffe08a;margin-bottom:0.4rem;font-weight:600}
.progress-box .bt{height:10px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(255,215,0,0.15)}
.progress-box .bf{height:100%;width:0%;background:linear-gradient(90deg,#ffd700,#ffed4a,#ffb347);border-radius:10px;transition:width 0.6s ease}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:2rem}
.module-card{background:rgba(0,10,25,0.6);border-radius:1.5rem;padding:1.2rem;border:1px solid rgba(255,215,0,0.15);transition:0.3s;text-decoration:none;color:#eef5ff}
.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(255,215,0,0.15);border-color:#ffd700}
.module-card .num{background:#ffd700;color:#000;font-weight:800;border-radius:50%;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;font-size:0.85rem;margin-bottom:0.5rem}
.module-card h3{font-size:1rem;font-weight:600}
.module-card .status{font-size:0.8rem;margin-top:0.3rem;color:#8899bb}

</style>

<body>
<nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../index.html">Programa</a><a href="../../../cursos/index.html">Cursos</a></nav>
<div class="container">
<div class="hero">
<div class="hero-header">
<h1>&#x1F4B0; Curso 1: Data Science para Finanzas Cuantitativas</h1>
<p>APIs financieras, backtesting, riesgo, fraude y trading algor&iacute;tmico con ML</p>
<div class="progress-box"><div class="pt"><span>Progreso</span><span id="pct">0%</span></div><div class="bt"><div class="bf" id="fill"></div></div></div>
</div>
<div class="module-grid" id="grid"></div>
<footer><i class="fas fa-graduation-cap"></i> Finanzas Cuantitativas &middot; 12 m&oacute;dulos</footer>
</div></div>
<script>
const MODS=[
{n:"01",t:"Datos Financieros &mdash; APIs OHLCV, Splits, Dividends",f:"01-datos-financieros.html"},
{n:"02",t:"An&aacute;lisis T&eacute;cnico &mdash; RSI, MACD, Bollinger, Se&ntilde;ales",f:"02-analisis-tecnico.html"},
{n:"03",t:"Backtesting Vectorizado &mdash; VectorBT, Slippage",f:"03-backtesting-vectorizado.html"},
{n:"04",t:"Risk Management &mdash; VaR, CVaR, Drawdown, Sharpe",f:"04-risk-management.html"},
{n:"05",t:"Portfolio Optimization &mdash; Markowitz, HRP, Black-Litterman",f:"05-portfolio-optimization.html"},
{n:"06",t:"Fraud Detection &mdash; Isolation Forest, Autoencoders",f:"06-fraud-detection.html"},
{n:"07",t:"Credit Scoring &mdash; WoE, IV, Scorecards, Basel",f:"07-credit-scoring.html"},
{n:"08",t:"High-Frequency Data &mdash; Order Book, Microestructura",f:"08-high-frequency-data.html"},
{n:"09",t:"RL para Trading &mdash; DQN, PPO, Gym-AnyTrading",f:"09-rl-trading.html"},
{n:"10",t:"Model Serving Financiero &mdash; TF Serving, Latencia Cr&iacute;tica",f:"10-model-serving-financiero.html"},
{n:"11",t:"Regulaci&oacute;n Financiera &mdash; MiFID II, SOX, Auditor&iacute;a",f:"11-regulacion-financiera.html"},
{n:"12",t:"Mini-Proyecto: Sistema Trading Cuantitativo",f:"12-mini-proyecto.html"}
];
const KEY="datos4_c1_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
const cid="c1-m"+m.n;
const d=done(cid);
if(d)completed++;
const card=document.createElement('a');card.className='module-card';card.href=m.f;
card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'&#x2705; Completado':'&#x25FB; Pendiente'}</div>`;
grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
<script src="../../../assets/js/i18n.js"></script>  </body>
