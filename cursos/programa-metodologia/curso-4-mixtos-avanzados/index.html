<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Curso 4: M&eacute;todos Mixtos y Avanzados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(135deg, #0a0f1e 0%, #0c1222 50%, #111a2e 100%);
      background-size: 200% 200%; animation: gradientShift 20s ease infinite;
      font-family: 'Inter', sans-serif; color: #eef5ff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;
    }
    @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    .course-container {
      max-width: 1200px; width: 100%;
      background: rgba(15, 25, 45, 0.65); backdrop-filter: blur(12px);
      border-radius: 3rem; border: 1px solid rgba(249, 115, 22, 0.25);
      box-shadow: 0 25px 45px rgba(0,0,0,0.5); overflow: hidden;
    }
    .hero-header {
      background: linear-gradient(95deg, #0b1120 0%, #111a2e 100%);
      padding: 2.5rem 2rem 1.5rem; text-align: center;
      border-bottom: 2px solid #f97316;
    }
    .hero-header h1 {
      font-size: 2.6rem; font-weight: 800;
      background: linear-gradient(135deg, #FFF, #fdba74, #f97316);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-header p { font-size: 1.1rem; color: #fed7aa; margin-top: 0.5rem; }
    .hero-header .sub { font-size: 0.85rem; color: #8899bb; margin-top: 0.3rem; }
    .badge-area { display: flex; justify-content: center; gap: 1rem; margin: 1.2rem 0 0.5rem; flex-wrap: wrap; }
    .chip { background: rgba(249,115,22,0.15); border: 1px solid #f97316; padding: 0.4rem 1rem; border-radius: 40px; font-size: 0.8rem; font-weight: 600; }
    .progress-container { max-width: 500px; margin: 1rem auto 0; }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.85rem; color: #fed7aa; margin-bottom: 0.3rem; font-weight: 600; }
    .progress-bar-track { height: 10px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; border: 1px solid rgba(249,115,22,0.2); }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f97316, #fdba74); border-radius: 10px; transition: width 0.6s ease; }
    .progress-detail { font-size: 0.78rem; color: #8899bb; margin-top: 0.3rem; }
    .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 2rem; }
    .module-card {
      background: rgba(10,20,40,0.7); border-radius: 1.5rem; padding: 1.2rem;
      border: 1px solid #2c3e66; transition: 0.2s; cursor: pointer; text-decoration: none; color: inherit;
    }
    .module-card:hover { transform: translateY(-4px); border-color: #f97316; box-shadow: 0 0 20px rgba(249,115,22,0.2); }
    .module-card .mod-num { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #f97316; }
    .module-card h3 { color: #eef5ff; font-size: 1.05rem; margin: 0.3rem 0; }
    .module-card p { font-size: 0.8rem; color: #8899bb; line-height: 1.5; }
    .module-card .status-icon { float: right; font-size: 1.2rem; }
    footer { text-align: center; padding: 1.2rem; font-size: 0.8rem; border-top: 1px solid #2c3e66; }
    @media (max-width:800px) { .hero-header h1 { font-size:1.8rem; } .module-grid { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="../../../assets/css/theme.css">
</head>
<body>
  <nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../../cursos/index.html">Cursos</a><a href="../index.html">Programa Metodolog&iacute;a</a></nav>
  <div class="course-container">
    <div class="hero-header">
      <h1><i class="fas fa-blender"></i> Curso 4: M&eacute;todos Mixtos y Avanzados</h1>
      <p>Integra metodolog&iacute;as para investigaciones m&aacute;s completas y robustas</p>
      <div class="badge-area">
        <span class="chip"><i class="fas fa-cube"></i> 12 m&oacute;dulos</span>
        <span class="chip"><i class="fas fa-blender"></i> MMR &middot; Convergente</span>
        <span class="chip"><i class="fas fa-chart-line"></i> PRISMA &middot; Metaan&aacute;lisis</span>
      </div>
      <div class="progress-container">
        <div class="progress-header">
          <span>Progreso</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="progress-detail" id="progressDetail">0 de 12 m&oacute;dulos completados</div>
      </div>
    </div>
    <div class="module-grid" id="moduleGrid"></div>
    <footer><i class="fas fa-crown"></i> Curso 4 &middot; M&eacute;todos Mixtos y Avanzados &middot; 12 m&oacute;dulos interactivos</footer>
  </div>
  <script>
    const MODULES = [
      { id:'01-portal.html', num:'1', title:'Diagn&oacute;stico Inicial', desc:'Eval&uacute;a tu conocimiento sobre m&eacute;todos mixtos, revisiones y metaan&aacute;lisis' },
      { id:'02-fundamentos-mmr.html', num:'2', title:'Fundamentos de MMR', desc:'Tipolog&iacute;as Creswell, cu&aacute;ndo usar m&eacute;todos mixtos' },
      { id:'03-convergente.html', num:'3', title:'Dise&ntilde;o Convergente', desc:'Datos cuanti y cuali simult&aacute;neos, integraci&oacute;n de resultados' },
      { id:'04-explicativo-secuencial.html', num:'4', title:'Dise&ntilde;o Explicativo Secuencial', desc:'Fase 1 cuanti → fase 2 cuali, los n&uacute;meros gu&iacute;an las preguntas' },
      { id:'05-exploratorio-secuencial.html', num:'5', title:'Dise&ntilde;o Exploratorio Secuencial', desc:'Fase 1 cuali → fase 2 cuanti, explorar para medir' },
      { id:'06-integracion-meta-inferencias.html', num:'6', title:'Meta-Inferencias', desc:'Joint display, matriz de integraci&oacute;n cuanti-cuali' },
      { id:'07-revisiones-sistematicas-prisma.html', num:'7', title:'Revisiones Sistem&aacute;ticas PRISMA', desc:'Flujo PRISMA 2026, cribado de art&iacute;culos' },
      { id:'08-metaanalisis.html', num:'8', title:'Metaan&aacute;lisis', desc:'Forest plot, funnel plot, heterogeneidad' },
      { id:'09-longitudinales-panel.html', num:'9', title:'Longitudinales y Panel', desc:'Datos panel, medici&oacute;n repetida en el tiempo' },
      { id:'10-evaluativa-dbr.html', num:'10', title:'Evaluativa y DBR', desc:'Indicadores de &eacute;xito, dise&ntilde;o basado en investigaci&oacute;n' },
      { id:'11-multimetodo-bigdata.html', num:'11', title:'Multim&eacute;todo y Big Data', desc:'Datos masivos + an&aacute;lisis cualitativo' },
      { id:'12-certificado.html', num:'12', title:'Certificado Final', desc:'Examina todo el curso y obt&eacute;n tu insignia' }
    ];
    const STORAGE_KEY = 'meto_4_progress';
    const KEYS = ['meto_4_01','meto_4_02','meto_4_03','meto_4_04','meto_4_05','meto_4_06','meto_4_07','meto_4_08','meto_4_09','meto_4_10','meto_4_11','meto_4_12'];
    const grid = document.getElementById('moduleGrid');
    let completed = 0;
    MODULES.forEach((m, i) => {
      const card = document.createElement('a');
      card.className = 'module-card';
      card.href = m.id;
      const done = localStorage.getItem(KEYS[i]) === 'true';
      if (done) completed++;
      card.innerHTML = '<div class="status-icon">' + (done ? '&#x2705;' : '&#x2B1C;') + '</div><div class="mod-num">M&oacute;dulo ' + m.num + '</div><h3>' + m.title + '</h3><p>' + m.desc + '</p>';
      card.addEventListener('click', () => localStorage.setItem('meto_4_last', m.id));
      grid.appendChild(card);
    });
    const pct = Math.round(completed / 12 * 100);
    document.getElementById('progressPercent').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressDetail').textContent = completed + ' de 12 m&oacute;dulos completados';
  </script>
  <script src="../../../assets/js/cookie-consent.js"></script>
</body>
</html>
