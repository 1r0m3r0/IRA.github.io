<script>
const MODS=[
{n:"01",t:"¿Qué es Python? Instalación y Hola Mundo",f:"01-que-es-python-instalacion-y-hola-mundo.html"},
{n:"02",t:"Variables, Tipos de Datos y Operadores",f:"02-variables-tipos-de-datos-y-operadores.html"},
{n:"03",t:"Strings y Métodos de Texto",f:"03-strings-y-metodos-de-texto.html"},
{n:"04",t:"Números y Operaciones Matemáticas",f:"04-numeros-y-operaciones-matematicas.html"},
{n:"05",t:"Entrada y Salida de Datos",f:"05-entrada-y-salida-de-datos.html"},
{n:"06",t:"Booleanos, Comparaciones y Lógica",f:"06-booleanos-comparaciones-y-logica.html"},
{n:"07",t:"Condicionales if/elif/else",f:"07-condicionales-if-elif-else.html"},
{n:"08",t:"Bucles for, while, range",f:"08-bucles-for-while-range.html"},
{n:"09",t:"Listas y Tuples",f:"09-listas-y-tuples.html"},
{n:"10",t:"Diccionarios y Sets",f:"10-diccionarios-y-sets.html"},
{n:"11",t:"Funciones: def, parámetros, return",f:"11-funciones-def-parametros-return.html"},
{n:"12",t:"Proyecto: Calculadora Interactiva",f:"12-proyecto-calculadora-interactiva.html"}
];
const KEY="pythonbasico_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
 const cid="curso-1-introduccion-m"+m.n;
 const d=done(cid);
 if(d)completed++;
 const card=document.createElement('a');card.className='module-card';card.href=m.f;
 card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'âœ… Completado':'â¬œ Pendiente'}</div>`;
 grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
