<div class="hero-header">
<h1>📊 Curso 2: Estructuras de Datos y Control Avanzado</h1>
<p>Domina listas, dicts, lambdas y algoritmos</p>
<div class="progress-box"><div class="pt"><span>Progreso</span><span id="pct">0%</span></div><div class="bt"><div class="bf" id="fill"></div></div></div>
</div>
<div class="module-grid" id="grid"></div>
<footer><i class="fas fa-graduation-cap"></i> Curso 2 · Python Básico · 12 módulos</footer>
</div></div>
<script>
const MODS=[
{n:"01",t:"Listas Avanzadas y Comprensión",f:"01-listas-avanzadas-y-comprension.html"},
{n:"02",t:"Slicing y Secuencias",f:"02-slicing-y-secuencias.html"},
{n:"03",t:"Enumerate y Zip",f:"03-enumerate-y-zip.html"},
{n:"04",t:"Recursividad",f:"04-recursividad.html"},
{n:"05",t:"Algoritmos de Búsqueda y Ordenamiento",f:"05-algoritmos-de-busqueda-y-ordenamiento.html"},
{n:"06",t:"Trabajo con Archivos de Texto",f:"06-trabajo-con-archivos-de-texto.html"},
{n:"07",t:"Manejo de Excepciones",f:"07-manejo-de-excepciones.html"},
{n:"08",t:"Comprensión de Diccionarios y Sets",f:"08-comprension-de-diccionarios-y-sets.html"},
{n:"09",t:"Funciones Lambda y map/filter/reduce",f:"09-funciones-lambda-y-map-filter-reduce.html"},
{n:"10",t:"*args y **kwargs",f:"10-args-y-kwargs.html"},
{n:"11",t:"Documentación y Docstrings",f:"11-documentacion-y-docstrings.html"},
{n:"12",t:"Proyecto: Analizador de Texto",f:"12-proyecto-analizador-de-texto.html"}
];
const KEY="pythonbasico_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
  const cid="curso-2-estructuras-datos-m"+m.n;
  const d=done(cid);
  if(d)completed++;
  const card=document.createElement('a');card.className='module-card';card.href=m.f;
  card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'✅ Completado':'⬜ Pendiente'}</div>`;
  grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
<script src="../../../assets/js/i18n.js"></script>  </body>
