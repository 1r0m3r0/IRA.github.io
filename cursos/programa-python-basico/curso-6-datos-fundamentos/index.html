<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="../../../favicon.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Curso 6: Datos | Python Básico</title><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><link rel="stylesheet" href="../../../assets/css/theme.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#0a0f1e,#0c1222,#111a2e);font-family:'Inter',sans-serif;color:#eef5ff;min-height:100vh;padding:2rem 1rem}
.container{max-width:1100px;margin:4rem auto 0}
.hero{background:rgba(15,25,45,0.65);backdrop-filter:blur(12px);border-radius:3rem;border:1px solid rgba(43,158,255,0.25);overflow:hidden}
.hero-header{background:linear-gradient(95deg,#0b1120,#111a2e);padding:2.5rem 2rem 2rem;text-align:center;border-bottom:2px solid #2b9eff}
.hero-header h1{font-size:2.4rem;font-weight:800;background:linear-gradient(135deg,#FFF,#7ab8ff,#2b9eff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-header p{color:#b9e2ff;margin-top:0.5rem}
.progress-box{margin-top:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
.progress-box .pt{display:flex;justify-content:space-between;font-size:0.85rem;color:#b9e2ff;margin-bottom:0.4rem;font-weight:600}
.progress-box .bt{height:10px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;border:1px solid rgba(43,158,255,0.15)}
.progress-box .bf{height:100%;width:0%;background:linear-gradient(90deg,#2b9eff,#7ab8ff,#00d4ff);border-radius:10px;transition:width 0.6s ease}
.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:2rem}
.module-card{background:rgba(0,10,25,0.6);border-radius:1.5rem;padding:1.2rem;border:1px solid rgba(43,158,255,0.15);transition:0.3s;text-decoration:none;color:#eef5ff}
.module-card:hover{transform:translateY(-3px);box-shadow:0 8px 25px rgba(43,158,255,0.15);border-color:#2b9eff}
.module-card .num{background:#2b9eff;color:#fff;font-weight:800;border-radius:50%;width:2rem;height:2rem;display:flex;align-items:center;justify-content:center;font-size:0.85rem;margin-bottom:0.5rem}
.module-card h3{font-size:1rem;font-weight:600}
.module-card .status{font-size:0.8rem;margin-top:0.3rem;color:#8899bb}
footer{text-align:center;padding:1.2rem;font-size:0.8rem;border-top:1px solid #2c3e66;color:#8899bb}
</style>
</head>
<body>
<nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../index.html">Programa</a><a href="../../../cursos/index.html">Cursos</a></nav>
<div class="container">
<div class="hero">
<div class="hero-header">
<h1>📈 Curso 6: Fundamentos de Datos</h1>
<p>NumPy, Pandas, Matplotlib y EDA completo</p>
<div class="progress-box"><div class="pt"><span>Progreso</span><span id="pct">0%</span></div><div class="bt"><div class="bf" id="fill"></div></div></div>
</div>
<div class="module-grid" id="grid"></div>
<footer><i class="fas fa-graduation-cap"></i> Curso 6 · Python Básico · 12 módulos</footer>
</div></div>
<script>
const MODS=[
{n:"01",t:"Introducción a NumPy",f:"01-introduccion-a-numpy.html"},
{n:"02",t:"Arrays y Operaciones Vectorizadas",f:"02-arrays-y-operaciones-vectorizadas.html"},
{n:"03",t:"Indexación y Slicing en NumPy",f:"03-indexacion-y-slicing-en-numpy.html"},
{n:"04",t:"Introducción a Pandas: Series",f:"04-introduccion-a-pandas-series.html"},
{n:"05",t:"Pandas DataFrames",f:"05-pandas-dataframes.html"},
{n:"06",t:"Limpieza de Datos",f:"06-limpieza-de-datos.html"},
{n:"07",t:"Visualización con Matplotlib",f:"07-visualizacion-con-matplotlib.html"},
{n:"08",t:"Estadística Descriptiva con Pandas",f:"08-estadistica-descriptiva-con-pandas.html"},
{n:"09",t:"GroupBy y Tablas Dinámicas",f:"09-groupby-y-tablas-dinamicas.html"},
{n:"10",t:"Importación/Exportación de Datos",f:"10-importacion-exportacion-de-datos.html"},
{n:"11",t:"Jupyter Notebooks",f:"11-jupyter-notebooks.html"},
{n:"12",t:"Proyecto: Análisis Exploratorio de Dataset",f:"12-proyecto-analisis-exploratorio-de-dataset.html"}
];
const KEY="pythonbasico_progress";
function getP(){return JSON.parse(localStorage.getItem(KEY))||[]}
function done(id){return getP().includes(id)}
const grid=document.getElementById('grid');
let completed=0;
MODS.forEach((m,i)=>{
  const cid="curso-6-datos-fundamentos-m"+m.n;
  const d=done(cid);
  if(d)completed++;
  const card=document.createElement('a');card.className='module-card';card.href=m.f;
  card.innerHTML=`<div class="num">${m.n}</div><h3>${m.t}</h3><div class="status">${d?'✅ Completado':'⬜ Pendiente'}</div>`;
  grid.appendChild(card);
});
const pct=Math.round((completed/12)*100);
document.getElementById('pct').textContent=pct+'%';
document.getElementById('fill').style.width=pct+'%';
</script>
</body>
</html>
