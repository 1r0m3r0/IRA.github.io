<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
 <title>SQL Básico Â· Curso 3 Â· Joins</title>
 <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
 <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <link rel="stylesheet" href="../../../assets/css/theme.css">
 <style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
   background: linear-gradient(135deg,#0a0e1a 0%,#0d1225 50%,#111832 100%);
   font-family: 'Inter',sans-serif;
   color:#eef5ff;
   min-height:100vh;
   padding:5rem 1rem 2rem;
  }
  .container { max-width:1100px; margin:0 auto; }
  .hero-header {
   text-align:center; padding:2.5rem 1rem;
   background: rgba(10,15,35,0.6); backdrop-filter:blur(14px);
   border-radius:2rem; border:1px solid rgba(43,158,255,0.2);
   margin-bottom:2.5rem;
  }
  .hero-header h1 {
   font-size:2.4rem; font-weight:800;
   background: linear-gradient(135deg,#2b9eff,#6366f1);
   -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .hero-header p { color:#b4c8e0; margin-top:0.5rem; font-size:1.05rem; }
  .course-badge {
   display:inline-block; padding:0.3rem 1rem; border-radius:2rem;
   background:rgba(43,158,255,0.15); border:1px solid rgba(43,158,255,0.3);
   color:#2b9eff; font-size:0.85rem; font-weight:600; margin-bottom:1rem;
  }
  .progress-stats {
   display:flex; justify-content:center; gap:1.5rem; margin-top:1.2rem;
   flex-wrap:wrap;
  }
  .progress-stats > div {
   background:rgba(43,158,255,0.08); padding:0.5rem 1.2rem;
   border-radius:1rem; font-size:0.9rem; font-weight:600;
  }
  .progress-stats span { color:#2b9eff; }
  .progress-bar-outer {
   width:100%; height:8px; background:rgba(255,255,255,0.08);
   border-radius:1rem; margin-top:1rem; overflow:hidden;
  }
  .progress-bar-inner {
   height:100%; width:0%; background:linear-gradient(90deg,#2b9eff,#6366f1);
   border-radius:1rem; transition: width 0.5s ease;
  }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.2rem; }
  .card {
   background:rgba(15,22,45,0.7); backdrop-filter:blur(10px);
   border-radius:1.5rem; border:1px solid rgba(43,158,255,0.15);
   padding:1.3rem 1.2rem; cursor:pointer; transition: all 0.3s ease;
   position:relative; overflow:hidden;
  }
  .card:hover {
   transform:translateY(-4px); border-color:rgba(43,158,255,0.5);
   box-shadow:0 8px 30px rgba(43,158,255,0.12);
  }
  .card.completed { border-color:rgba(0,255,136,0.4); }
  .card.completed .card-check { opacity:1; }
  .card.locked { opacity:0.5; cursor:not-allowed; }
  .card.locked:hover { transform:none; box-shadow:none; }
  .card-num {
   font-size:0.75rem; font-weight:700; color:rgba(43,158,255,0.6);
   text-transform:uppercase; letter-spacing:0.08em;
  }
  .card-title { font-size:1.05rem; font-weight:600; margin:0.3rem 0 0.5rem; }
  .card-bar {
   width:100%; height:4px; background:rgba(255,255,255,0.06);
   border-radius:1rem; overflow:hidden; margin-top:0.8rem;
  }
  .card-bar-fill {
   height:100%; width:0%; background:#2b9eff; border-radius:1rem;
   transition: width 0.4s ease;
  }
  .card.completed .card-bar-fill { background:#00ff88; width:100%; }
  .card-check {
   position:absolute; top:0.8rem; right:0.8rem;
   color:#00ff88; font-size:1.1rem; opacity:0; transition:0.3s;
  }
  .card-icon { font-size:1.4rem; margin-bottom:0.4rem; }
  .reset-btn {
   background:rgba(255,70,70,0.12); border:1px solid rgba(255,70,70,0.3);
   color:#ff6b6b; padding:0.5rem 1.2rem; border-radius:2rem;
   cursor:pointer; font-size:0.85rem; font-weight:600; margin-top:1.5rem;
   transition:0.3s; font-family:inherit;
  }
  .reset-btn:hover { background:rgba(255,70,70,0.2); }
  .footer-text {
   text-align:center; margin-top:3rem; padding-top:1.5rem;
   border-top:1px solid rgba(43,158,255,0.1);
   color:#6a7f9f; font-size:0.85rem;
  }
  @media(max-width:600px){
   .hero-header h1 { font-size:1.6rem; }
   .grid { grid-template-columns:1fr; }
  }
 </style>
</head>
<body>
 <nav class="brand-return-nav">
  <a href="../../../index.html"><i class="fas fa-arrow-left"></i> Portfolio</a>
  <a href="../../../cursos/index.html"><i class="fas fa-graduation-cap"></i> Cursos</a>
  <a href="../index.html"><i class="fas fa-layer-group"></i> Programa SQL</a>
 </nav>
 <div class="container">
  <div class="hero-header">
   <div class="course-badge"><i class="fas fa-code-branch"></i> Curso 3 Â· Joins</div>
   <h1><i class="fas fa-code-fork"></i> Joins y Relaciones</h1>
   <p>INNER JOIN, LEFT JOIN, Self-Join y más ” 12 módulos interactivos</p>
   <div class="progress-stats">
    <div><i class="fas fa-check-circle"></i> Completados: <span id="completedCount">0</span>/12</div>
    <div><i class="fas fa-percent"></i> Progreso: <span id="progressPercent">0</span>%</div>
   </div>
   <div class="progress-bar-outer"><div class="progress-bar-inner" id="progressBarInner"></div></div>
  </div>
  <div class="grid" id="cardGrid"></div>
  <div style="text-align:center;">
   <button class="reset-btn" onclick="resetProgress()"><i class="fas fa-trash-alt"></i> Reiniciar progreso</button>
  </div>
  <div class="footer-text">
   <i class="fas fa-database"></i> SQL Básico Â· Programa completo Â· 3 cursos Â· 36 módulos
  </div>
 </div>
 <script>
  const STORAGE_KEY = 'sqlbasico_c3_progress';
  const modules = [
   { id:1, title:'Llave Primaria y Foránea', icon:'fa-key' },
   { id:2, title:'Relaciones 1:1, 1:M y M:M', icon:'fa-diagram-project' },
   { id:3, title:'INNER JOIN', icon:'fa-circle-nodes' },
   { id:4, title:'LEFT JOIN y RIGHT JOIN', icon:'fa-arrow-right-to-bracket' },
   { id:5, title:'FULL OUTER JOIN', icon:'fa-arrows-left-right' },
   { id:6, title:'CROSS JOIN', icon:'fa-crosshairs' },
   { id:7, title:'NATURAL JOIN y USING', icon:'fa-leaf' },
   { id:8, title:'Self-Join', icon:'fa-rotate' },
   { id:9, title:'JOIN de 3+ Tablas', icon:'fa-table-cells' },
   { id:10, title:'JOIN con Condiciones Compuestas', icon:'fa-equals' },
   { id:11, title:'Anti-Joins', icon:'fa-ban' },
   { id:12, title:'Mini-Proyecto: Sistema de Pedidos', icon:'fa-cart-shopping' }
  ];
  function getProgress(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch(e){ return []; } }
  function saveProgress(arr){ localStorage.setItem(STORAGE_KEY,JSON.stringify(arr)); updateGlobal(); }
  function updateGlobal(){
   try{
    const all=JSON.parse(localStorage.getItem('sqlbasico_progress'))||[];
    const c3=getProgress();
    const offset=24;
    const merged=[...new Set([...all,...c3.map(n=>n+offset)])];
    localStorage.setItem('sqlbasico_progress',JSON.stringify(merged));
   }catch(e){}
  }
  function isCompleted(id){ return getProgress().includes(id); }
  function toggleModule(id){
   if(isCompleted(id)) return;
   window.location.href=(id<10?'0':'')+id+'-'+getSlug(id)+'.html';
  }
  function getSlug(id){
   const slugs=[
    'llave-primaria-foranea','relaciones','inner-join','left-right-join',
    'full-outer-join','cross-join','natural-join-using','self-join',
    'join-3-tablas','join-condiciones-compuestas','anti-joins','mini-proyecto-pedidos'
   ];
   return slugs[id-1];
  }
  function render(){
   const prog=getProgress();
   const grid=document.getElementById('cardGrid');
   grid.innerHTML=modules.map((m,i)=>{
    const done=prog.includes(m.id);
    const locked=i>0&&!prog.includes(modules[i-1].id)&&i!==0;
    return `<div class="card${done?' completed':''}${locked&&!done?' locked':''}" onclick="${!locked||done?'toggleModule('+m.id+')':''}">
     <div class="card-check"><i class="fas fa-check-circle"></i></div>
     <div class="card-icon"><i class="fas ${m.icon}"></i></div>
     <div class="card-num">Módulo ${m.id<10?'0':''}${m.id}</div>
     <div class="card-title">${m.title}</div>
     <div class="card-bar"><div class="card-bar-fill" style="width:${done?100:0}%"></div></div>
    </div>`;
   }).join('');
   document.getElementById('completedCount').textContent=prog.length;
   document.getElementById('progressPercent').textContent=Math.round(prog.length/12*100);
   document.getElementById('progressBarInner').style.width=(prog.length/12*100)+'%';
  }
  function resetProgress(){
   if(!confirm('¿Reiniciar todo el progreso del Curso 3?')) return;
   localStorage.removeItem(STORAGE_KEY);
   render();
  }
  render();
 </script>
<script src="../../../assets/js/i18n.js"></script>  </body>
</html>
