<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
 <title>Curso 2 | MLOps</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(135deg,#0a0f1e 0%,#0c1222 50%,#111a2e 100%); background-size:200% 200%; animation:gradientShift 20s ease infinite; font-family:'Inter',sans-serif; color:#eef5ff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
  @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .course-container { max-width:1100px; width:100%; background:rgba(15,25,45,0.65); backdrop-filter:blur(12px); border-radius:3rem; border:1px solid rgba(156,100,255,0.25); box-shadow:0 25px 45px rgba(0,0,0,0.5); overflow:hidden; }
  .hero-header { background:linear-gradient(95deg,#0b1120,#111a2e); padding:2rem 2rem 1.5rem; text-align:center; border-bottom:2px solid #9c64ff; }
  .hero-header h1 { font-size:2.4rem; font-weight:800; background:linear-gradient(135deg,#FFF,#c4a5ff,#9c64ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-header p { font-size:1rem; color:#c4a5ff; margin-top:0.4rem; }
  .badge-area { display:flex; justify-content:center; gap:0.8rem; margin:1rem 0 0; flex-wrap:wrap; }
  .chip { background:rgba(156,100,255,0.15); border:1px solid #9c64ff; padding:0.3rem 0.8rem; border-radius:40px; font-size:0.75rem; font-weight:600; color:#c4a5ff; }
  .progress-container { max-width:480px; margin:1rem auto; }
  .progress-header { display:flex; justify-content:space-between; font-size:0.8rem; color:#b9e2ff; margin-bottom:0.3rem; font-weight:600; }
  .progress-bar-track { height:8px; background:rgba(255,255,255,0.08); border-radius:10px; overflow:hidden; border:1px solid rgba(156,100,255,0.15); }
  .progress-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#9c64ff,#b885ff,#d4b5ff); background-size:200% 100%; animation:progressShimmer 3s ease-in-out infinite; border-radius:10px; transition:width 0.6s ease; }
  @keyframes progressShimmer { 0%{background-position:0% 0%} 50%{background-position:100% 0%} 100%{background-position:0% 0%} }
  .progress-detail { font-size:0.75rem; color:#667799; margin-top:0.2rem; text-align:center; }
  .module-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1rem; padding:1.5rem 2rem 2rem; }
  .module-card { background:rgba(10,20,40,0.7); border-radius:1.2rem; padding:1.2rem; border:1px solid #2c3e66; transition:0.2s; cursor:pointer; text-decoration:none; color:inherit; display:flex; flex-direction:column; }
  .module-card:hover { transform:translateY(-3px); border-color:#9c64ff; box-shadow:0 0 15px rgba(156,100,255,0.15); }
  .module-card .m-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem; }
  .module-card .m-num { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:#9c64ff; }
  .module-card .m-status { font-size:0.9rem; }
  .module-card h3 { font-size:1rem; margin:0.3rem 0; color:#eef5ff; }
  .module-card p { font-size:0.8rem; color:#667799; line-height:1.4; flex:1; }
  .module-card .m-tech { margin-top:0.5rem; font-size:0.7rem; color:#8899bb; }
  footer { text-align:center; padding:1rem; font-size:0.8rem; border-top:1px solid #2c3e66; color:#667799; }
  @media (max-width:800px) { .hero-header h1 { font-size:1.6rem; } .module-grid { grid-template-columns:1fr; } }
 </style>
 <link rel="stylesheet" href="../../../assets/css/theme.css">
</head>
<body>
 <nav class="brand-return-nav"><a href="../../../index.html">&larr; Portfolio</a><a href="../../../cursos/index.html">Cursos</a><a href="../index.html">Programa Datos III</a></nav>
 <div class="course-container">
  <div class="hero-header">
   <h1><i class="fas fa-brain"></i> CURSO 2: MLOPS</h1>
   <p>Experiment tracking, contenedores, orquestación, serving y monitoreo</p>
   <div class="badge-area">
    <span class="chip"><i class="fas fa-cube"></i> 12 módulos</span>
    <span class="chip"><i class="fas fa-docker"></i> MLflow &bull; Docker &bull; K8s &bull; Kserve</span>
   </div>
   <div class="progress-container">
    <div class="progress-header"><span>ðŸ“Š Progreso del curso</span><span id="progressPercent">0%</span></div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-detail" id="progressDetail">0 de 12 módulos completados</div>
   </div>
  </div>
  <div class="module-grid" id="moduleGrid"></div>
  <footer><i class="fas fa-crown"></i> MLOps &middot; 12 módulos interactivos</footer>
 </div>
 <script>
  var MODULES = [
   {num:'01',slug:'01-mlflow',title:'MLflow',desc:'Experiment tracking, model registry',emoji:'\u{1F9EA}'},
   {num:'02',slug:'02-tfx',title:'TFX',desc:'ExampleGen, Transform, Trainer, Evaluator',emoji:'\u{1F3ED}'},
   {num:'03',slug:'03-docker-ml',title:'Docker para ML',desc:'Multi-stage, GPU, model images',emoji:'\u{1F4E6}'},
   {num:'04',slug:'04-kubernetes',title:'Kubernetes',desc:'Pods, deployments, services, HPA',emoji:'\u2693'},
   {num:'05',slug:'05-k8s-ml',title:'K8s para ML',desc:'Kubeflow, Kserve, Seldon, canary',emoji:'\u{1F916}'},
   {num:'06',slug:'06-model-serving',title:'Model Serving',desc:'Kserve, BentoML, Triton Inference',emoji:'\u{1F3AF}'},
   {num:'07',slug:'07-cicd-ml',title:'CI/CD para ML',desc:'GitHub Actions, DVC, CML',emoji:'\u{1F504}'},
   {num:'08',slug:'08-monitoreo',title:'Monitoreo',desc:'Evidently, Prometheus, Grafana',emoji:'\u{1F4CA}'},
   {num:'09',slug:'09-data-drift',title:'Data Drift + Concept Drift',desc:'PSI, KS, DDM, ADWIN',emoji:'\u{1F321}\uFE0F'},
   {num:'10',slug:'10-ab-testing',title:'A/B Testing en ML',desc:'Feature flags, traffic split',emoji:'\u{1F9EA}'},
   {num:'11',slug:'11-model-governance',title:'Model Governance',desc:'Versioning, lineage, audit, model cards',emoji:'\u{1F4CB}'},
   {num:'12',slug:'12-mini-proyecto',title:'Mini-Proyecto',desc:'Deploy MLflow\u2192Docker\u2192K8s\u2192Kserve',emoji:'\u{1F3C6}'}
  ];
  var grid = document.getElementById('moduleGrid');
  var completed = 0;
  MODULES.forEach(function(m) {
   var key = 'datos3_c2_' + m.num;
   var done = localStorage.getItem(key) === 'true';
   if (done) completed++;
   var card = document.createElement('a');
   card.className = 'module-card';
   card.href = m.slug + '/index.html';
   card.innerHTML = '<div class="m-top"><span class="m-num">M\u00f3dulo ' + m.num + '</span><span class="m-status">' + (done ? '\u2705' : '\u{1F7E3}') + '</span></div><h3>' + m.emoji + ' ' + m.title + '</h3><p>' + m.desc + '</p><div class="m-tech"><i class="fas fa-arrow-right"></i> Explorar m\u00f3dulo</div>';
   grid.appendChild(card);
  });
  var pct = Math.round((completed / MODULES.length) * 100);
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressDetail').textContent = completed + ' de ' + MODULES.length + ' m\u00f3dulos completados';
 </script>
<script src="../../../assets/js/i18n.js"></script>  </body>
</html>
