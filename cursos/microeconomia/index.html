<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
 <title>Microeconomía | Menú del Curso</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
 <style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:linear-gradient(135deg,#0a0f1e 0%,#0c1222 50%,#111a2e 100%); background-size:200% 200%; animation:gradientShift 20s ease infinite; font-family:'Inter',sans-serif; color:#eef5ff; min-height:100vh; padding:2rem 1rem; }
  @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .hero { max-width:1300px; margin:0 auto; text-align:center; padding:2rem 1rem; }
  .hero h1 { font-size:3rem; font-weight:800; background:linear-gradient(135deg,#fff,#00e0ff,#2b9eff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { color:#99b8e0; margin-top:0.6rem; font-size:1.15rem; }
  .progress-container { max-width:1300px; margin:1.5rem auto 0; background:#0b1120cc; backdrop-filter:blur(8px); border-radius:2rem; padding:1.5rem 2rem; border:1px solid #2c3e66; }
  .progress-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
  .progress-header h3 { font-size:1rem; font-weight:600; }
  .progress-bar-bg { flex:1; min-width:200px; height:12px; background:#1a2a4a; border-radius:20px; overflow:hidden; }
  .progress-bar-fill { height:100%; width:0%; background:linear-gradient(90deg,#00e0ff,#2b9eff,#00ffc8); border-radius:20px; transition:width 0.6s ease; }
  .progress-text { font-weight:700; font-size:1.1rem; color:#00e0ff; min-width:60px; text-align:right; }
  .btn-continue { background:linear-gradient(95deg,#f0a500,#ff6a00); border:none; padding:0.9rem 2.5rem; font-weight:700; border-radius:3rem; cursor:pointer; font-size:1.1rem; transition:0.2s; color:#1e1a0c; margin-top:0.8rem; }
  .btn-continue:hover { transform:translateY(-3px); box-shadow:0 0 20px rgba(240,165,0,0.5); }
  .btn-continue:disabled { opacity:0.4; cursor:default; transform:none; box-shadow:none; }
  .track-section { max-width:1300px; margin:2rem auto; }
  .track-title { font-size:1.5rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:0.7rem; }
  .track-title .track-badge { background:#2c3e66; padding:0.2rem 0.8rem; border-radius:20px; font-size:0.8rem; font-weight:600; }
  .track-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
  .mod-card { background:rgba(15,25,45,0.7); backdrop-filter:blur(8px); border-radius:1.5rem; padding:1.2rem; border:1px solid #2c3e66; transition:0.2s; position:relative; overflow:hidden; text-decoration:none; color:#eef5ff; display:flex; flex-direction:column; }
  .mod-card:hover { transform:translateY(-3px); box-shadow:0 10px 25px rgba(0,224,255,0.15); }
  .mod-card.completed { border-color:gold; }
  .mod-card.completed::after { content:'\2713'; position:absolute; top:0.5rem; right:0.8rem; font-size:1.5rem; color:gold; font-weight:bold; }
  .mod-card .num { font-size:0.75rem; font-weight:700; color:#99b8e0; letter-spacing:1px; }
  .mod-card .title { font-size:1rem; font-weight:600; margin-top:0.3rem; }
  .mod-card .desc { font-size:0.8rem; color:#99b8e0; margin-top:0.4rem; }
  .mod-card .status-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:0.4rem; }
  .mod-card .status-dot.pending { background:#555; }
  .mod-card .status-dot.done { background:gold; box-shadow:0 0 6px gold; }
  .mod-card.expert { border-color:#9933ff44; }
  .mod-card.expert .num { color:#b380ff; }
  footer { text-align:center; padding:1.5rem; font-size:0.8rem; color:#668; }
  @media (max-width:600px){ .hero h1 { font-size:2rem; } .track-grid { grid-template-columns:1fr; } }
 
.objectives { background: rgba(255,179,71,0.1); border-radius: 1.5rem; padding: 1rem 1.5rem; margin: 1.5rem 2rem; border: 1px solid rgba(255,179,71,0.3); }
.objectives h3 { color: #ffb347; font-size: 1.1rem; margin-bottom: 0.7rem; }
.objectives li { color: #b9ccee; font-size: 0.9rem; margin: 0.4rem 0; list-style: none; }
.objectives li::before { content: "🎯 "; }
.module-recap { background: rgba(255,179,71,0.08); border-radius: 1.5rem; padding: 1rem 1.5rem; margin: 1.5rem 2rem; border: 1px dashed rgba(255,179,71,0.4); }
.module-recap h3 { color: #ffb347; font-size: 1rem; margin-bottom: 0.5rem; }
.module-recap li { color: #8899bb; font-size: 0.85rem; margin: 0.3rem 0; }
</style>
 <link rel="stylesheet" href="../../assets/css/theme.css">
</head>
<body>
 <nav class="brand-return-nav"><a href="../../index.html">&larr; Portfolio</a><a href="../../cursos/index.html">Cursos</a></nav>
 <div class="hero">
  <h1><i class="fas fa-chart-line"></i> Microeconomía</h1>
  <p>Domina los fundamentos de la microeconomía · 16 módulos principales + 8 avanzados</p>
 </div>

 <div class="progress-container" id="progressContainer">
  <div class="progress-header">
   <h3><i class="fas fa-tasks"></i> Tu Progreso</h3>
   <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
   <span class="progress-text" id="progressText">0%</span>
  </div>
  <button class="btn-continue" id="btnContinue"><i class="fas fa-play"></i> Continuar Curso</button>
 </div>

 <div class="track-section">
  <div class="track-title"><i class="fas fa-layer-group" style="color:#00e0ff"></i> Módulos Principales <span class="track-badge">16</span></div>
  <div class="track-grid" id="mainGrid"></div>
 </div>

 <div class="track-section">
  <div class="track-title"><i class="fas fa-flask" style="color:#b380ff"></i> Módulos Avanzados <span class="track-badge">8</span></div>
  <div class="track-grid" id="expertGrid"></div>
 </div>

 <footer><i class="fas fa-crown"></i> Microeconomía · Universidad Mayor de San Andrés</footer>

 <script>
  const PAGE_KEYS = {
   '01-portal-inicio.html': { key: 'micro_01', title: 'Portal de Inicio', num: '01', desc: 'Diagnóstico y primeros pasos', track: 'main', icon: 'fa-rocket' },
   '02-escasez-eleccion.html': { key: 'micro_02', title: 'Escasez y Elección', num: '02', desc: 'FPP, costo de oportunidad y eficiencia', track: 'main', icon: 'fa-balance-scale' },
   '03-oferta-demanda.html': { key: 'micro_03', title: 'Oferta y Demanda', num: '03', desc: 'Equilibrio de mercado, escasez y excedente', track: 'main', icon: 'fa-chart-simple' },
   '04-elasticidad.html': { key: 'micro_04', title: 'Elasticidad', num: '04', desc: 'Precio, ingreso y elasticidad cruzada', track: 'main', icon: 'fa-ruler-combined' },
   '05-utilidad-preferencias.html': { key: 'micro_05', title: 'Utilidad y Preferencias', num: '05', desc: 'Utilidad marginal y curvas de indiferencia', track: 'main', icon: 'fa-heart' },
   '06-curvas-indiferencia.html': { key: 'micro_06', title: 'Curvas de Indiferencia', num: '06', desc: 'Preferencias del consumidor', track: 'main', icon: 'fa-chart-area' },
   '07-restriccion-presupuestaria.html': { key: 'micro_07', title: 'Restricción Presupuestaria', num: '07', desc: 'Recta presupuestaria y conjunto factible', track: 'main', icon: 'fa-wallet' },
   '08-maximizacion-utilidad.html': { key: 'micro_08', title: 'Maximización de Utilidad', num: '08', desc: 'Elección óptima del consumidor', track: 'main', icon: 'fa-bullseye' },
   '09-costos-produccion.html': { key: 'micro_09', title: 'Costos de Producción', num: '09', desc: 'Costos fijos, variables y marginales', track: 'main', icon: 'fa-industry' },
   '10-competencia-perfecta.html': { key: 'micro_10', title: 'Competencia Perfecta', num: '10', desc: 'Maximización de beneficios en CP', track: 'main', icon: 'fa-store' },
   '11-monopolio.html': { key: 'micro_11', title: 'Monopolio', num: '11', desc: 'Poder de mercado y pérdida irrecuperable', track: 'main', icon: 'fa-crown' },
   '12-oligopolio.html': { key: 'micro_12', title: 'Oligopolio', num: '12', desc: 'Interdependencia y colusión', track: 'main', icon: 'fa-link' },
   '13-competencia-monopolistica.html': { key: 'micro_13', title: 'Competencia Monopolística', num: '13', desc: 'Diferenciación de producto', track: 'main', icon: 'fa-tags' },
   '14-externalidades.html': { key: 'micro_14', title: 'Externalidades', num: '14', desc: 'Costes y beneficios externos', track: 'main', icon: 'fa-leaf' },
   '15-bienes-publicos.html': { key: 'micro_15', title: 'Bienes Públicos', num: '15', desc: 'Provisión y free riders', track: 'main', icon: 'fa-people-group' },
   '16-fallos-mercado.html': { key: 'micro_16', title: 'Fallos de Mercado', num: '16', desc: 'Intervención estatal y regulación', track: 'main', icon: 'fa-triangle-exclamation' },
   'e1-teoria-juegos.html': { key: 'micro_e1', title: 'Teoría de Juegos', num: 'E1', desc: 'Estrategias y equilibrio de Nash', track: 'expert', icon: 'fa-chess' },
   'e2-subastas.html': { key: 'micro_e2', title: 'Subastas', num: 'E2', desc: 'Tipos y estrategias de puja', track: 'expert', icon: 'fa-gavel' },
   'e3-economia-comportamiento.html': { key: 'micro_e3', title: 'Economía del Comportamiento', num: 'E3', desc: 'Sesgos y decisiones reales', track: 'expert', icon: 'fa-brain' },
   'e4-informacion-asimetrica.html': { key: 'micro_e4', title: 'Información Asimétrica', num: 'E4', desc: 'Selección adversa y riesgo moral', track: 'expert', icon: 'fa-eye-slash' },
   'e5-equilibrio-general.html': { key: 'micro_e5', title: 'Equilibrio General', num: 'E5', desc: 'Walras y eficiencia', track: 'expert', icon: 'fa-infinity' },
   'e6-bienestar.html': { key: 'micro_e6', title: 'Economía del Bienestar', num: 'E6', desc: 'Óptimo social y equidad', track: 'expert', icon: 'fa-hand-holding-heart' },
   'e7-riesgo-incertidumbre.html': { key: 'micro_e7', title: 'Riesgo e Incertidumbre', num: 'E7', desc: 'Utilidad esperada y aversión', track: 'expert', icon: 'fa-dice' },
   'e8-analisis-politicas.html': { key: 'micro_e8', title: 'Análisis de Políticas', num: 'E8', desc: 'Evaluación de intervenciones', track: 'expert', icon: 'fa-chart-pie' }
  };
  const entries = Object.entries(PAGE_KEYS);
  function getProgress() {
   let completed = 0;
   for (const [,v] of entries) { if (localStorage.getItem(v.key)==='true') completed++; }
   return { completed, total: entries.length };
  }
  function render() {
   const { completed, total } = getProgress();
   const pct = total > 0 ? Math.round((completed/total)*100) : 0;
   document.getElementById('progressFill').style.width = pct+'%';
   document.getElementById('progressText').textContent = pct+'%';
   const btn = document.getElementById('btnContinue');
   if (completed === total) {
    btn.textContent = '\u{1F3C6} \u00a1Completado!';
    btn.disabled = true;
   } else {
    const first = entries.find(([,v]) => localStorage.getItem(v.key)!=='true');
    if (first) {
     btn.innerHTML = '<i class="fas fa-play"></i> Continuar: ' + first[1].title;
     btn.onclick = () => window.location.href = first[0];
    }
   }
   const mainGrid = document.getElementById('mainGrid');
   const expertGrid = document.getElementById('expertGrid');
   mainGrid.innerHTML = '';
   expertGrid.innerHTML = '';
   for (const [file, info] of entries) {
    const done = localStorage.getItem(info.key) === 'true';
    const card = document.createElement('a');
    card.className = 'mod-card' + (done ? ' completed' : '') + (info.track==='expert' ? ' expert' : '');
    card.href = file;
    card.innerHTML = '<div class="num">M\u00f3dulo ' + info.num + '</div><div class="title"><span class="status-dot ' + (done?'done':'pending') + '"></span>' + info.title + '</div><div class="desc">' + info.desc + '</div>';
    if (info.track==='expert') expertGrid.appendChild(card);
    else mainGrid.appendChild(card);
   }
  }
  render();
 </script>
 </body>
</html>
