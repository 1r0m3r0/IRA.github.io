<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Israel Romero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e27;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        /* ── Floating background shapes ── */
        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: floatShape 12s ease-in-out infinite;
            pointer-events: none;
        }

        .shape--1 {
            width: 300px;
            height: 300px;
            background: #00d4ff;
            top: -60px;
            left: -80px;
            animation-delay: 0s;
        }

        .shape--2 {
            width: 200px;
            height: 200px;
            background: #a855f7;
            bottom: -40px;
            right: -60px;
            animation-delay: -4s;
        }

        .shape--3 {
            width: 150px;
            height: 150px;
            background: #00ff41;
            top: 50%;
            left: 90%;
            animation-delay: -8s;
        }

        .shape--4 {
            width: 100px;
            height: 100px;
            background: #ec4899;
            top: 70%;
            left: 5%;
            animation-delay: -2s;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }

        .shape--5 {
            width: 180px;
            height: 180px;
            background: #00d4ff;
            bottom: 10%;
            left: 25%;
            animation-delay: -6s;
            border-radius: 40% 60% 30% 70% / 50% 40% 60% 50%;
        }

        @keyframes floatShape {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(30px, -40px) rotate(90deg) scale(1.05); }
            50% { transform: translate(-20px, 20px) rotate(180deg) scale(0.95); }
            75% { transform: translate(15px, -25px) rotate(270deg) scale(1.02); }
        }

        /* ── Card ── */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(26, 31, 58, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 1.5rem;
            padding: 3.5rem 4rem;
            text-align: center;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(0, 212, 255, 0.35);
        }

        /* ── 404 ── */
        .error-code {
            font-family: 'Press Start 2P', monospace;
            font-size: 6rem;
            line-height: 1;
            margin-bottom: 0.75rem;
            background: linear-gradient(135deg, #00d4ff 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.45));
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.35)); }
            50% { filter: drop-shadow(0 0 50px rgba(0, 212, 255, 0.65)); }
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .message {
            font-size: 0.95rem;
            color: #b4bcd0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .message i {
            margin-right: 0.35rem;
            color: #00d4ff;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, #00d4ff, #a855f7);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.25);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 212, 255, 0.45);
        }

        .btn-home:active {
            transform: translateY(0);
        }

        .btn-home i {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Floating background shapes -->
    <div class="shape shape--1"></div>
    <div class="shape shape--2"></div>
    <div class="shape shape--3"></div>
    <div class="shape shape--4"></div>
    <div class="shape shape--5"></div>

    <!-- Main card -->
    <div class="card">
        <div class="error-code">404</div>
        <p class="subtitle">Página no encontrada</p>
        <p class="message">
            <i class="fa-solid fa-link-slash"></i>
            Parece que este bloque no está en la cadena...
        </p>
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i>
            Volver al Inicio
        </a>
    </div>

</body>
</html>
